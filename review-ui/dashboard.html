<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAKIM · Dashboard</title>
<script src="/face.js"></script>
<link rel="stylesheet" href="/face.css">
<style>
:root{
 --bg:#0D0F16;--panel:#1B1F2C;--panel2:#232837;--line:#262B3A;--railbg:#0A0C12;
 --gold:#e8b95a;--gold2:#72D5C8;--teal:#72D5C8;--mint:#72D5C8;--mint2:#60B3A8;--red:#E05252;--amber:#b6bccb;
 --inc:#72D5C8;--exp:#D98A93;--trf:#9BA3C9;--alert:#E05252;
 --txt:#FFFFFF;--lbl:#8A90A6;--muted:#5A6072;
 --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;--sans:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;
 --sp:24px;--rad:14px;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
a{color:inherit;text-decoration:none}
/* left nav */
.rail{position:fixed;left:0;top:0;bottom:0;width:222px;z-index:40;background:var(--railbg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.brand{padding:2px 8px 16px}.brand .wm{font-family:var(--mono);font-size:15px;letter-spacing:2px;font-weight:800;color:var(--txt)}
.brand .wm .sp{color:var(--gold)}   /* the one surviving gold pixel */
.brand .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--lbl);font-weight:600;font-size:14.5px;cursor:pointer}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.85}.nav:hover{background:#1a1d23;color:var(--txt)}
.nav.active{background:rgba(114,213,200,.12);color:var(--gold2)}.nav.dis{color:#4b5260;cursor:default}
.nav .qbadge{margin-left:auto;background:var(--mint);color:#0D0F16;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:800;font-family:var(--mono)}
.nav small,.soon small{margin-left:auto;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#4b5260;font-family:var(--mono)}
.rsec{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#4b5260;margin:18px 10px 8px;display:flex}
.rsec .rt{margin-left:auto;color:var(--amber)}
.acc{display:flex;align-items:center;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.acc:hover{background:#1a1d23}.acc .an{flex:1;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.acc .av{font-family:var(--mono);font-weight:600;color:var(--txt)}.acc.crd .av{color:var(--amber)}
.soon{display:flex;align-items:center;gap:11px;padding:8px 12px;color:#4b5260;font-size:13.5px}.soon i{font-style:normal;width:18px;text-align:center}
.spacer{flex:1;min-height:12px}
.railstat{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.railstat .live{display:inline-flex;align-items:center;gap:7px;color:var(--teal)}
.railstat .live .d{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 7px var(--teal);animation:pul 2s infinite}
.railstat .live.off{color:var(--muted)}.railstat .live.off .d{background:var(--muted);box-shadow:none;animation:none}
.railstat .live.amber{color:var(--amber)}.railstat .live.amber .d{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.railstat .bad{color:var(--red)}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
/* content */
.app{max-width:1600px;padding:22px 28px 64px;margin-left:max(222px,calc((100% - 1600px)/2));margin-right:auto}
@media(max-width:1200px){.grid>*{min-width:0}}
@media(max-width:480px){.app{padding:14px 10px 48px}.topbar{flex-wrap:wrap;gap:8px}.quicknav{grid-template-columns:1fr 1fr;gap:12px}.hero .n{font-size:26px}.pcard.front .pnum{font-size:15px;letter-spacing:1px}.stmt{gap:20px}.stmt .n{font-size:20px}}
/* money typography (everywhere) */
.cur{font-size:.6em;color:var(--muted);margin-right:3px;font-weight:600}.dec{font-size:.6em;color:var(--muted)}
/* top bar */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:var(--sp)}
.topbar h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px}
.topbar .subtitle{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.topbar .grow{flex:1}
.searchpill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:9px 16px;color:var(--muted);font-size:13px;cursor:text;min-width:180px}
select,.iconbtn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-family:var(--mono);cursor:pointer}
.iconbtn{position:relative;font-size:15px}
.iconbtn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(114,213,200,.15);color:var(--gold);display:grid;place-items:center;font-weight:800}
/* quick-nav tiles */
.quicknav{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp);margin-bottom:var(--sp)}
.qtile{background:linear-gradient(180deg,#1B1F2C,#151823);border:1px solid var(--line);border-radius:var(--rad);padding:16px;cursor:pointer;transition:.15s}
.qtile:nth-child(even){background:linear-gradient(180deg,#1B2530,#16202A)}
.qtile:hover{border-color:var(--mint)}
.qtile .qh{display:flex;align-items:center;justify-content:space-between}
.qtile .qi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px}
.qtile .qi svg{width:18px;height:18px}
.qtile .qarrow{color:var(--muted)}
.qtile .ql{font-size:12px;color:var(--lbl);margin-top:14px}
.qtile .qv{font-family:var(--mono);font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.qtile .qsub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px}
.pace{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:7px;line-height:1.4}
.pace .pbar{position:relative;flex:0 0 46px;height:5px;border-radius:3px;background:#2a2f3d;overflow:visible}
.pace .pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#5b6577}
.pace .pbar b{position:absolute;top:-2px;width:2px;height:9px;border-radius:1px;background:var(--mint);transform:translateX(-1px)}
/* alerts strip */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:var(--sp)}
.alert{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer;border:1px solid}
.alert.warn{background:rgba(182,188,203,.06);border-color:rgba(182,188,203,.32);color:var(--txt)}
.alert.bad{background:rgba(224,82,82,.08);border-color:rgba(224,82,82,.4);color:var(--txt)}
.alert .ai{font-size:15px}.alert .agrow{flex:1}.alert .ago{font-family:var(--mono);font-size:11px;color:var(--mint)}
/* cash-flow bars */
.cf{display:flex;align-items:flex-end;gap:18px;height:150px;margin-top:14px;position:relative}
.cf .cfm{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.cf .cfbars{display:flex;gap:5px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.cf .cfbars b{width:26px;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cf .cfbars b .barval{position:absolute;top:-13px;left:50%;transform:translateX(-50%)}
.cf .cfm{cursor:default}.cf .cfm:hover .cfbars b{filter:brightness(1.12)}
.cf .cfbars b.i{background:var(--inc)}.cf .cfbars b.o{background:var(--exp)}
.cf .cfl{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cflegend{display:flex;gap:16px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px}
.cflegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.dowhdr{display:flex;align-items:baseline;justify-content:space-between}
.dowtoggle{font-family:var(--mono);font-size:11px;color:var(--mint);cursor:pointer}
/* grid */
.grid{display:grid;grid-template-columns:8fr 4fr;gap:var(--sp);align-items:start}
.card{background:linear-gradient(180deg,#1B1F2C,#151823);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px}
.card+.card{margin-top:var(--sp)}
.lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--lbl);font-weight:600}
.sub2{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px}
.teal{color:var(--teal)}.amber{color:var(--amber)}.red{color:var(--red)}.dim{color:var(--muted)}.up{color:var(--teal)}.down{color:var(--amber)}
/* directional money: income mint · expense rose · transfer lavender */
.inc{color:var(--inc)}.exp{color:var(--exp)}.trf{color:var(--trf)}
.trow .amt{opacity:.82;transition:opacity .12s,filter .12s;filter:saturate(.85)}
.trow:hover .amt{opacity:1;filter:saturate(1.15)}
/* hero + chart */
/* hero-zone spacing pass (item 2): the top 400px earns the "expensive" feeling — more air here
   only; density below the fold is untouched. */
.card.hero{padding:28px 26px 24px}
.herorow{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hero .n{font-family:var(--face-display);font-size:48px;font-weight:600;letter-spacing:-.5px;line-height:1;margin-top:16px;font-variant-numeric:tabular-nums}
.hero .n .cur{font-family:var(--face-display);font-size:20px;font-weight:400;opacity:.5;letter-spacing:.02em;margin-right:.18em}
.hero .n .dec{font-size:20px;font-weight:400;opacity:.5;letter-spacing:0}
.hero .note{color:var(--muted);font-size:12px;margin-top:8px;font-family:var(--mono)}
.delta{font-family:var(--mono);font-size:13px;font-weight:700;margin-left:18px;position:relative;top:-7px}
.rangechips{display:flex;gap:6px}.rangechips b{font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:20px;background:var(--panel2);color:var(--lbl);cursor:pointer;font-weight:600}
.rangechips b.on{background:rgba(114,213,200,.16);color:var(--mint)}
.chartwrap{position:relative;margin-top:14px}
.axl{fill:var(--muted);font-family:var(--mono);font-size:10px}
.ttip{position:absolute;background:#fff;color:#0D0F16;border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:11px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 6px 18px rgba(0,0,0,.5);white-space:nowrap;z-index:5}
.ttip b{color:#0D0F16;font-size:11px}.ttip div{margin-top:2px}.ttip .up{color:#2f9e86}.ttip .down{color:#c98a3a}
/* statement */
.stmt{display:flex;gap:36px;flex-wrap:wrap;align-items:baseline;margin-top:20px}
.stmt .n{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1}.stmt .s{color:var(--muted);font-size:11px;margin-top:6px;font-family:var(--mono)}
.sec{font-size:13px;font-weight:700;margin:2px 0}.secsub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:12px}
/* rows (shared anatomy) */
.trow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:9px;cursor:pointer}
.trow:hover{background:var(--panel2)}
.avc{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;color:#12140f;flex:none;font-family:var(--mono)}
.trow .mid{flex:1;min-width:0}
.trow .nm{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .meta{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.trow .amt{font-family:var(--mono);font-weight:800;font-size:15px;text-align:right}
.trow .bar{height:5px;border-radius:3px;margin-top:6px;background:var(--panel2);overflow:hidden}.trow .bar i{display:block;height:100%}
.pill{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
/* day-of-week bars */
.dow{display:flex;gap:10px;align-items:flex-end;height:130px;margin-top:10px;position:relative}
.dow .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:default}
.dow .c b{width:70%;background:var(--panel2);border-radius:5px 5px 0 0;min-height:3px}
.dow .c.hi b{background:var(--teal)}
.dow .c.max b{background:var(--exp)}
.dow .c .dv{font-family:var(--mono);font-size:9px;color:var(--exp);font-weight:700;height:12px}
.dow .c span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.dow .c:hover b{background:var(--mint2)}
/* right rail */
.side .card+.card{margin-top:var(--sp)}
.cardstack{margin:6px 0 2px}
.pcard.front{position:relative;overflow:hidden;border-radius:16px;padding:18px;aspect-ratio:1.586/1;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.5);
 background:linear-gradient(135deg,#9FE0D2,#5FB3A6)!important;border:none!important;color:#0D2523}
.pcard.front>*{position:relative;z-index:2}
.pcard.front .sheen{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 30%,rgba(255,255,255,0) 55%)}
.pcard.front .orn{position:absolute;right:18px;bottom:16px;z-index:1;width:92px;height:50px;pointer-events:none}
.pcard.front .orn i{position:absolute;bottom:0;width:50px;height:50px;border-radius:50%}
.pcard.front .orn i:first-child{right:28px;background:rgba(255,255,255,.18)}
.pcard.front .orn i:last-child{right:0;background:rgba(13,37,35,.15)}
.pcard.front .ptop{display:flex;justify-content:space-between;align-items:flex-start}
.pcard.front .pbank{font-weight:700;font-size:13px;letter-spacing:.4px;color:#0D2523}
.pcard.front .pnfc{font-size:15px;color:#0D2523;opacity:.5}
.pcard.front .pchip{width:36px;height:27px;border-radius:6px;margin-top:12px;position:relative;
 background:linear-gradient(135deg,#e2cd94,#b49a56);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pcard.front .pchip::after{content:'';position:absolute;inset:5px 5px;border-radius:2px;opacity:.4;
 background:linear-gradient(#0d2523,#0d2523) center/100% 1px no-repeat,linear-gradient(#0d2523,#0d2523) 34% top/1px 100% no-repeat,linear-gradient(#0d2523,#0d2523) 66% top/1px 100% no-repeat}
.pcard.front .pnum{font-family:var(--mono);font-size:19px;letter-spacing:3px;font-weight:600;margin-top:auto;color:#0a201d;
 text-shadow:0 1px 0 rgba(255,255,255,.4),0 -1px 0 rgba(0,0,0,.16)}
.pcard.front .pfoot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.pcard.front .pfoot small{display:block;font-size:8px;letter-spacing:1.2px;text-transform:uppercase;opacity:.5;margin-bottom:3px}
.pcard.front .pholder{font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.pcard.front .pbal{font-family:var(--mono);font-weight:800;font-size:15px;color:#0D2523;text-align:right}
.pcard.front .pnet{position:absolute;right:18px;top:46px;z-index:2;font-weight:800;font-size:12px;letter-spacing:1px;color:#0D2523;opacity:.72;font-style:italic}
.pcard.SABB{background:#4e1d22;border:1px solid #6e2b31}.pcard.SNB{background:#14314e;border:1px solid #21486b}.pcard.CARD{background:#2a2e36;border:1px solid var(--line)}
.edges{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.edge{height:28px;border-radius:8px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11.5px;cursor:pointer;color:var(--lbl);border-left:3px solid var(--muted)}
.edge:hover{color:var(--txt)}
.edge.SABB{background:#2c1618;border-left-color:#b04a52}.edge.SNB{background:#152736;border-left-color:#4c86c0}.edge.CARD{background:var(--panel2)}
.edge .ea{color:var(--amber)}
.stackhead{display:flex;justify-content:space-between;align-items:baseline}
.up-row{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:13.5px;border-bottom:1px solid var(--panel2)}.up-row:last-child{border:none}
.up-row .amt{font-family:var(--mono);font-weight:700}.up-row .st{font-size:10px;color:var(--amber);font-family:var(--mono)}
.compbar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:10px 0 14px}.compbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint2),var(--mint))}
.sq{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:var(--lbl)}.sq .mk{width:16px}.sq.done{color:var(--txt)}
.muted{color:var(--muted);text-align:center;padding:16px;font-size:13px}.thin{color:var(--lbl);font-size:13px;padding:22px 12px;text-align:center;font-family:var(--mono)}
.rev{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--amber);font-family:var(--mono)}.rev .d{width:6px;height:6px;border-radius:50%;background:var(--amber)}
@media(max-width:1200px){.grid{grid-template-columns:1fr}.quicknav{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.rail{width:56px;padding:14px 6px}.brand .wm{font-size:0}.brand .wm::before{content:"✦";font-size:18px;color:var(--gold)}.brand .sub,.nav span:not(.qbadge),.soon span,.rsec,.acc,.railstat{display:none}.nav,.soon{justify-content:center}.app{margin-left:56px}}
/* global ⌘K search palette */
.pal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal.show{display:flex}
.palbox{width:min(620px,92vw);background:#151823;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.palbox input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--txt);font-size:16px;padding:16px 18px;outline:none;font-family:var(--sans)}
.pallist{max-height:52vh;overflow-y:auto}
.palrow{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer}
.palrow.on,.palrow:hover{background:var(--panel2)}
.palrow .pi{width:26px;text-align:center;font-size:15px}
.palrow .pl{flex:1;min-width:0}.palrow .pl .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.palrow .pl .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
.palrow .pt{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
.palhint{padding:10px 18px;font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.nwtog{display:inline-flex;gap:2px;margin-left:10px;vertical-align:middle;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.nwtog b{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:3px 8px;cursor:pointer}
.nwtog b.on{background:rgba(114,213,200,.16);color:var(--mint)}
/* --- Dashboard charter: month's shape · household · fixed-flex · chore line --- */
.cmpwrap{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:9px}
.cmpr{display:flex;align-items:baseline;gap:12px;font-size:13px}
.cmpr .cl{color:var(--lbl);min-width:120px}
.cmpr .cv{font-family:var(--mono);font-weight:800}
.cmpr .cs{color:var(--muted);font-family:var(--mono);font-size:11px}
.cmpnote{color:var(--muted);font-family:var(--mono);font-size:10.5px;opacity:.8}
.ffwrap{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.ffbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--panel2)}
.ffbar i{display:block;height:100%}
.fflegend{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:9px}
.fflegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.cdim{color:var(--muted);opacity:.75}

<body>
<aside class="rail" id="hakim-rail"></aside>
<div class="app">
  <div class="topbar">
    <div><h1 id="greet">Dashboard</h1><div class="subtitle" id="subt">reading current ledger</div></div>
    <div class="grow"></div>
    <div class="searchpill" onclick="openPal()"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg> <span>Search… <span style="opacity:.6">⌘K</span></span></div>
    <select id="month" onchange="load()"></select>
    <button class="iconbtn" title="Calendar" onclick="location.href='/calendar'"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v16H4z"/><path d="M4 9h16M8 3v4M16 3v4"/></svg></button>
    <button class="iconbtn" id="bell" title="Alerts" onclick="location.href='/'"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
    <button class="iconbtn" title="Settings" onclick="location.href='/settings'"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 3h-4l-.3 2.2a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7.5 7.5 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.3 2.2h4l.3-2.2a7 7 0 0 0 1.7-1l2.3 1 2-3.4z"/></svg></button>
    <div class="avatar">✦</div>
  </div>
  <div class="alerts" id="alerts"></div>
  <div class="quicknav" id="quicknav"></div>
  <div id="body"><div class="muted">Loading…</div></div>
</div>
<script>
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
function m(n){n=Number(n||0);const neg=n<0;n=Math.abs(n);const i=Math.floor(n).toLocaleString('en-US');const d=(n-Math.floor(n)).toFixed(2).slice(1);return `<span class="cur">SAR</span>${neg?'−':''}${i}<span class="dec">${d}</span>`;}
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function relTime(ds){const d=Math.round((Date.now()-new Date(ds+'T00:00:00'))/864e5);return d<=0?'today':d===1?'1d ago':d<30?d+'d ago':Math.round(d/30)+'mo ago';}
function netLabel(n){return n==='visa'?'VISA':n==='mastercard'?'Mastercard':n==='mada'?'mada':'';}
const CAT={'Utilities & telecom':['⚡','#5b8def'],'Eating out & delivery':['🍴','#e879a6'],'Car':['🚗','#72D5C8'],'Transport & taxis':['🚕','#5b8def'],'Travel':['✈️','#a78bfa'],'Home creation (villa)':['🏠','#d0946b'],'Home & maintenance':['🔧','#7dd3fc'],'Bank & fees':['🏦','#8b919c'],'Groceries & supermarket':['🛒','#72D5C8'],'Clothing & accessories':['👕','#f0806c'],'Electronics & gadgets':['📱','#5b8def'],'Other (miscellaneous)':['📦','#8b919c'],'Personal care':['💈','#e879a6'],'Medical & pharmacy':['💊','#f0806c'],'School & education':['🎓','#a78bfa'],'Government & documents':['📄','#8b919c'],'Entertainment & outings':['🎬','#a78bfa'],'Subscriptions & digital':['📺','#a78bfa'],'Sports & fitness':['🏋️','#72D5C8'],'Gifts & occasions':['🎁','#e879a6'],'Insurance':['🛡️','#72D5C8'],'Household staff':['🧹','#7dd3fc'],'Capital contribution: Factory':['🏭','#9aa4bf'],'Salary & allowances':['💵','#72D5C8'],'Business income':['💼','#72D5C8'],'Uncategorized':['❔','#5c6270'],'To review':['❓','#72D5C8']};
const cI=c=>(window.icFor?window.icFor(c):''),cC=c=>(CAT[(c||'').split(':')[0].trim()]||['🧾','#8b919c'])[1];
const hasCat=c=>!!CAT[(c||'').split(':')[0].trim()]&&c!=='To review';
const LI={inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M4 13h5l1.5 2.5h3L15 13h5"/></svg>',cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 10h18M6.5 15h4"/></svg>',wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h14a2 2 0 012 2v7a2 2 0 01-2 2H5a2 2 0 01-2-2V6.5a2 2 0 012-2h11"/><circle cx="16.5" cy="13" r="1.2"/></svg>'};
const initials=n=>{const w=(n||'?').replace(/[^A-Za-z؀-ۿ ]/g,'').trim().split(/\s+/);return((w[0]||'?')[0]+((w[1]||'')[0]||'')).toUpperCase();};
const avColor=n=>['#5FB3A6','#72D5C8','#a78bfa','#5b8def','#e879a6','#f0806c','#7dd3fc'][(n||'').length%7];
function monLabel(x){ // honest empty: an empty ledger has no month — never print 'Invalid Date'
  if(!x||!/^\d{4}-\d{2}$/.test(x)){const n=new Date();return n.toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
  const [y,mm]=x.split('-');return new Date(y,mm-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
function greet(){const h=new Date().getHours();return(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', Mohamed';}
let RANGE='ALL',DASH=null,RAIL=null,QN=null,CPTS=[],cardFront=0,DOWSORT=false,NWMODE='nw';
function cycleCard(i){cardFront=i;render(DASH);}
async function load(){const mo=document.getElementById('month').value||'';
  const [d,q]=await Promise.all([fetch('/api/dash'+(mo?('?month='+mo):'')).then(r=>r.json()),fetch('/api/queue').then(r=>r.json()).catch(()=>null)]);
  DASH=d;QN=q;const sel=document.getElementById('month');
  if(!sel.options.length)sel.innerHTML=d.months.map(x=>`<option value="${x}" ${x===d.month?'selected':''}>${monLabel(x)}</option>`).join('');
  render(d);}
function abbr(v){const a=Math.abs(v);return (v<0?'−':'')+(a>=1000?Math.round(a/1000)+'K':Math.round(a));}
function xfmt(ds){const d=new Date(ds);return RANGE==='1M'?d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}):d.toLocaleDateString('en-GB',{month:'short'});}
function chart(series){let s=series||[];if(RANGE==='1M')s=s.slice(-5);else if(RANGE==='3M')s=s.slice(-13);
  const W=760,H=210,L=52,R=14,T=12,B=26;
  if(s.length<2)return '<div class="thin">Net-worth history builds as weeks pass.</div>';
  const vals=s.map(p=>p.value);let mn=Math.min(...vals),mx=Math.max(...vals);const pd=(mx-mn)*0.18||1000;mn-=pd;mx+=pd;
  const x=i=>L+i*(W-L-R)/(s.length-1),y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let grid='',ylab='';for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3,yy=y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#232830"/>`;ylab+=`<text x="${L-8}" y="${(yy+3).toFixed(1)}" text-anchor="end" class="axl">${abbr(v)}</text>`;}
  let xlab='';
  if(RANGE==='1M'){const st=Math.max(1,Math.floor((s.length-1)/4));for(let i=0;i<s.length;i+=st)xlab+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" class="axl">${new Date(s[i].date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</text>`;}
  else{let lm=-1;s.forEach((p,i)=>{const mo=new Date(p.date).getMonth();if(mo!==lm){lm=mo;xlab+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" class="axl">${new Date(p.date).toLocaleDateString('en-GB',{month:'short'})}</text>`;}});}
  const pts=s.map((p,i)=>`${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  CPTS=s.map((p,i)=>({px:x(i),py:y(p.value),date:p.date,value:p.value,delta:i>0?p.value-s[i-1].value:0}));
  const last=CPTS[CPTS.length-1];
  return `<div class="chartwrap" id="cw"><svg viewBox="0 0 ${W} ${H}" width="100%" height="210" id="nwsvg"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--teal)" stop-opacity=".22"/><stop offset="1" stop-color="var(--teal)" stop-opacity="0"/></linearGradient></defs>${grid}<polygon points="${L},${H-B} ${pts} ${W-R},${H-B}" fill="url(#g)"/><polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linejoin="round"/><circle cx="${last.px.toFixed(1)}" cy="${last.py.toFixed(1)}" r="3.5" fill="var(--teal)"/>${ylab}${xlab}<line id="chx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--teal)" stroke-width="1" opacity="0"/><circle id="chd" r="4" fill="var(--teal)" opacity="0"/></svg></div>`;}
function setupChart(){const cw=document.getElementById('cw');if(!cw)return;const svg=document.getElementById('nwsvg'),chx=document.getElementById('chx'),chd=document.getElementById('chd');
  // migrated to the ONE shared face tooltip (window.hkTip) — crosshair + dot stay, label is now the shared popup.
  cw.onmousemove=e=>{const r=svg.getBoundingClientRect();const sx=(e.clientX-r.left)/r.width*760;let best=0,bd=1e9;CPTS.forEach((p,i)=>{const dd=Math.abs(p.px-sx);if(dd<bd){bd=dd;best=i;}});const p=CPTS[best];
    chx.setAttribute('x1',p.px);chx.setAttribute('x2',p.px);chx.setAttribute('opacity','.55');chd.setAttribute('cx',p.px);chd.setAttribute('cy',p.py);chd.setAttribute('opacity','1');
    const dt=new Date(p.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    const mny=window.hkMoney?window.hkMoney(p.value):('SAR '+money0(p.value));
    const html=`<div class="tt-hd">${dt}</div><div class="tt-row"><span class="k">net worth</span><span class="v">${mny}</span></div><div class="tt-row"><span class="k">change</span><span class="v ${p.delta>=0?'pos':'neg'}">${p.delta>=0?'▲':'▼'} ${money0(Math.abs(p.delta))}</span></div>`;
    window.hkTip?window.hkTip.show(html,e.clientX,e.clientY):0;};
  cw.onmouseleave=()=>{window.hkTip&&window.hkTip.hide();chx.setAttribute('opacity','0');chd.setAttribute('opacity','0');};}
function setRange(r){RANGE=r;render(DASH);}
function quicknav(d){
  // Dashboard charter: money-first POSITION facts only. No review-queue chore here (→ the one quiet
  // chore line), no pace/urgency (pace belongs to Today/Insights — off the dashboard by charter).
  const t=[
   [LI.card,'#e0876c','Card debt',(d.cards_debt?'−SAR '+money0(d.cards_debt):'—'),"location.href='/accounts'",'amber',(d.other_debt>0?`+ SAR ${money0(d.other_debt)} financing · total debt −SAR ${money0(d.debt)}`:'what you owe on cards')],
   [LI.wallet,'#72D5C8','Available cash','SAR '+money0(d.cash),"location.href='/accounts'",'teal','wallet + bank balances']];
  return t.map(x=>`<div class="qtile" onclick="${x[4]}"><div class="qh"><div class="qi" style="background:${x[1]}1e;color:${x[1]}">${x[0]}</div><span class="qarrow">→</span></div><div class="ql">${x[2]}</div><div class="qv ${x[5]}">${x[3]}</div>${x[6]?`<div class="qsub">${x[6]}</div>`:''}</div>`).join('');}
// The month's shape (charter #2): in·out·net for this month, with last month + the 3-month typical
// shown inline. This is a COMPLETED-PERIOD comparison, never a pace judgment or forecast.
function mshape(d){
  const s=d.shape||{}; const T=s.this||{in:d.inflow,out:d.outflow,net:d.net};
  function cmp(label,ref){
    if(!ref) return '';
    const dn=T.net-ref.net, better=dn>=0;
    return `<div class="cmpr"><span class="cl">${label}</span><span class="cv ${better?'inc':'exp'}">${better?'▲':'▼'} ${m(Math.abs(dn))}</span><span class="cs">their net ${ref.net>=0?'+':'−'}${money0(Math.abs(ref.net))}${ref.n?` · avg of ${ref.n} mo`:''}</span></div>`;
  }
  const hasCmp=s.last||s.typical;
  const ff=(s.fixed||0)+(s.flexible||0)+(s.untagged||0);
  const seg=(v,c,t)=>v>0?`<i style="width:${v/ff*100}%;background:${c}" data-tip="${t} SAR ${money0(v)}"></i>`:'';
  const ffbar=ff>0?`<div class="ffwrap"><div class="s" style="margin-bottom:7px">fixed vs flexible spending <span class="cdim">· tagged categories only</span></div>
    <div class="ffbar">${seg(s.fixed,'#7C9DFF','Fixed')}${seg(s.flexible,'#e8b95a','Flexible')}${seg(s.untagged,'#3a4150','Untagged')}</div>
    <div class="fflegend"><span><i style="background:#7C9DFF"></i>fixed ${money0(s.fixed)}</span><span><i style="background:#e8b95a"></i>flexible ${money0(s.flexible)}</span><span><i style="background:#3a4150"></i>untagged ${money0(s.untagged)}</span></div></div>`:'';
  return `<div class="card"><div class="lbl">${esc(monLabel(d.month))} · the month's shape</div>
    <div class="stmt" id="stmt">
      <div><div class="n inc">+${m(T.in)}</div><div class="s">in · ${d.days_in} days</div></div>
      <div><div class="n exp">−${m(T.out)}</div><div class="s">out</div></div>
      <div><div class="n ${T.net>=0?'inc':'exp'}">${T.net>=0?'+':'−'}${m(Math.abs(T.net))}</div><div class="s">net</div></div>
      <div><div class="n">${d.count}</div><div class="s">transactions</div></div></div>
    ${hasCmp?`<div class="cmpwrap">${cmp('vs last month',s.last)}${cmp('vs 3-mo typical',s.typical)}<div class="cmpnote">completed-period comparison · not a pace or forecast</div></div>`:`<div class="thin" style="margin-top:12px">First stretch of data — last-month and 3-month-typical comparison appear once prior months complete.</div>`}
    ${ffbar}</div>`;
}
// Household split (charter #3): uniquely available since Sarah's import. Spending + net by person,
// tappable to each person's filtered Desk. "Unassigned" where attribution is genuinely unknown.
function household(d){
  const h=d.household||{}, RQ=mrange(d.month), order=['Mohamed','Sarah','joint','unassigned'];
  const rows=order.map(k=>({k,spend:(h[k]&&h[k].spend)||0,net:(h[k]&&h[k].net)||0})).filter(r=>r.spend>0||r.net!==0);
  if(!rows.length) return '';
  const tot=rows.reduce((a,r)=>a+r.spend,0)||1;
  const COL={Mohamed:'#72D5C8',Sarah:'#e879a6',joint:'#a78bfa',unassigned:'#6b7382'};
  const LBL={Mohamed:'Mohamed',Sarah:'Sarah',joint:'Joint / family',unassigned:'Unassigned'};
  const LINK={Mohamed:"/?person="+encodeURIComponent('Mohamed'),Sarah:"/?person="+encodeURIComponent('Sarah'),joint:"/?person="+encodeURIComponent('Family'),unassigned:''};
  const bar=`<div class="hhbar">${rows.map(r=>r.spend>0?`<i style="width:${r.spend/tot*100}%;background:${COL[r.k]}" data-tip="${LBL[r.k]} · ${window.hkMoney?window.hkMoney(r.spend):('SAR '+money0(r.spend))}"></i>`:'').join('')}</div>`;
  return `<div class="card"><div class="sec">Household · this month</div><div class="secsub">who spent · tap a row to open their transactions</div>
    ${bar}
    ${rows.map(r=>`<div class="trow" ${LINK[r.k]?`onclick="location.href='${LINK[r.k]}${RQ}'"`:''} style="cursor:${LINK[r.k]?'pointer':'default'}"><div class="avc" style="background:${COL[r.k]}">${r.k==='joint'?'⇋':r.k==='unassigned'?'?':initials(r.k)}</div><div class="mid"><div class="nm">${LBL[r.k]}</div><div class="meta">net ${r.net>=0?'+':'−'}SAR ${money0(Math.abs(r.net))} this month${r.k==='unassigned'?' · tag these on the Desk to attribute them':''}</div></div><div class="amt exp">${r.spend>0?'−'+m(r.spend):'—'}</div></div>`).join('')}</div>`;
}
// carry the active month into deep-link hrefs (was lost in the forward-view removal refactor — its
// absence ReferenceError'd render(); node --check can't see a runtime call to an undefined function).
function mrange(month){if(!month||month==='all')return '';const p=month.split('-'),last=new Date(+p[0],+p[1],0).getDate();return `&from=${month}-01&to=${month}-${String(last).padStart(2,'0')}`;}
function render(d){
  const RQ=mrange(d.month);   // literal '&from=..&to=..' embedded into onclick hrefs (eval'd at click time)
  document.getElementById('greet').textContent=greet();
  document.getElementById('subt').textContent="Dashboard · where you stand · position & this month's shape";
  document.getElementById('quicknav').innerHTML='';   // money now OPENS the page, inside the body
  const cards=(RAIL&&RAIL.cards)||[];
  let main='';
  // hero + chart
  // presentation-only toggle: Net worth ⇄ Debt remaining (never inverts the underlying series/axis)
  const debtMode=NWMODE==='debt'&&d.net_worth<0;
  const heroVal=debtMode?`<span class="amber">${m(Math.abs(d.net_worth))}</span>`:m(d.net_worth);
  const heroDelta=debtMode
    ?`<span class="delta ${d.nw_month_delta>=0?'up':'down'}">${d.nw_month_delta>=0?'↓':'↑'} ${money0(Math.abs(d.nw_month_delta))} ${d.nw_month_delta>=0?'shrinking debt':'more debt'}</span>`
    :`<span class="delta ${d.nw_month_delta>=0?'up':'down'}">${d.nw_month_delta>=0?'▲':'▼'} ${money0(Math.abs(d.nw_month_delta))} this month</span>`;
  const nwToggle=d.net_worth<0?`<span class="nwtog"><b class="${!debtMode?'on':''}" onclick="NWMODE='nw';render(DASH)">Net worth</b><b class="${debtMode?'on':''}" onclick="NWMODE='debt';render(DASH)">Debt remaining</b></span>`:'';
  main+=`<div class="card hero"><div class="herorow"><div><div class="lbl">${debtMode?'Debt remaining':'Net worth'} ${nwToggle}</div><div class="n">${heroVal}${heroDelta}</div><div class="note">${debtMode?'falling toward zero · presentation only, ledger unchanged':'assets − debts'+(d.net_worth<0?' · debts exceed assets today':'')}</div></div>
    <div class="rangechips">${['1M','3M','ALL'].map(r=>`<b class="${RANGE===r?'on':''}" onclick="setRange('${r}')">${r}</b>`).join('')}</div></div>${chart(d.nw_series)}</div>`;
  // position tiles (card debt · available cash) — the two facts not shown big elsewhere
  main+=`<div class="quicknav" style="grid-template-columns:repeat(2,1fr);margin-bottom:var(--sp)">${quicknav(d)}</div>`;
  // the month's shape (in·out·net + last + typical + fixed/flex)
  main+=mshape(d);
  // household split (Mohamed · Sarah · joint · unassigned) — unique since Sarah's import
  main+=household(d);
  // (Forward view — "next 7 days" + long-lead "Ahead" — retired from the dashboard now that the Today
  //  tab has shipped; Today owns "what's coming" permanently, per the charter removal condition.)
  // the ONE quiet chore line — below the money summary, only when something needs Mohamed (paintAlerts)
  main+=`<div id="chores"></div>`;
  // cash-flow (monthly income vs spending) — all months with data, honest about sparseness
  if(d.flow&&d.flow.length){const mx=Math.max(1,...d.flow.map(f=>Math.max(f.in,f.out)));
    const lab=(v,h)=>h>=26?`<span class="barval">${abbr(v)}</span>`:'';   // value label only when the bar can hold it
    main+=`<div class="card"><div class="dowhdr"><div><div class="sec">Cash flow</div><div class="secsub">income vs spending · ${d.flow.length} month${d.flow.length>1?'s':''} of data</div></div><span class="secsub" style="margin:0">peak SAR ${money0(mx)}</span></div>
      <div class="cf">${d.flow.map(f=>{const hi=Math.round(f.in/mx*100),ho=Math.round(f.out/mx*100);const lbl=new Date(f.month+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
        return `<div class="cfm" data-tip="${window.hkTipFlow(lbl,f.in,f.out)}"><div class="cfbars"><b class="i" style="height:${hi}%">${lab(f.in,hi)}</b><b class="o" style="height:${ho}%">${lab(f.out,ho)}</b></div><span class="cfl">${new Date(f.month+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short'})}</span></div>`;}).join('')}</div>
      <div class="cflegend"><span><i style="background:var(--inc)"></i>income</span><span><i style="background:var(--exp)"></i>spending</span><span style="margin-left:auto;opacity:.7">hover a month for in · out · net</span></div></div>`;}
  if(d.count<10){main+=`<div class="card"><div class="thin">📊 Only ${d.count} transaction${d.count===1?'':'s'} · ${d.days_in} days in — breakdowns sharpen as the month fills. Pick a fuller month above.</div></div>`;}
  else{
    const maxc=Math.max(1,...d.cats.map(c=>c.amount));
    const nc=Math.min(8,d.cats.length);
    main+=`<div class="card"><div class="dowhdr"><div class="sec">Spending by category</div><a class="dowtoggle" href="/categories">View all →</a></div><div class="secsub">Top ${nc} · ${esc(monLabel(d.month))} · tap a row to open it in the Desk</div>`+
      d.cats.slice(0,8).map(c=>`<div class="trow" onclick="location.href='/?category='+encodeURIComponent('${esc(c.name)}')+'${RQ}'"><div class="pill" style="background:${cC(c.name)}22;color:${cC(c.name)}">${cI(c.name)}</div><div class="mid"><div class="nm">${esc(c.name)}</div><div class="bar"><i style="width:${Math.max(3,c.amount/maxc*100)}%;background:${cC(c.name)}"></i></div></div><div class="amt exp">−${m(c.amount)}</div></div>`).join('')+`</div>`;
    main+=`<div class="card"><div class="dowhdr"><div class="sec">Top merchants</div><a class="dowtoggle" href="/categories">View all →</a></div><div class="secsub">${esc(monLabel(d.month))} · spending</div>`+(d.merchants.length?d.merchants.map(mm=>`<div class="trow" onclick="location.href='/?merchant='+encodeURIComponent('${esc(mm.key||mm.name)}')+'${RQ}'"><div class="avc" style="background:${avColor(mm.name)}">${initials(mm.name)}</div><div class="mid"><div class="nm">${esc(mm.name)}</div><div class="meta">${mm.count} transaction${mm.count>1?'s':''}</div></div><div class="amt exp">−${m(mm.total)}</div></div>`).join(''):'<div class="muted">None.</div>')+`</div>`;
    // person + dow
    main+=`<div class="card"><div class="sec">By person</div>`+(d.people.length?d.people.map(p=>`<div class="trow" onclick="location.href='/?person='+encodeURIComponent('${esc(p.name)}')+'${RQ}'"><div class="avc" style="background:${avColor(p.name)}">${initials(p.name)}</div><div class="mid"><div class="nm">${esc(p.name)}</div></div><div class="amt ${p.net>=0?'inc':'exp'}">${p.net>=0?'+':'−'}${m(Math.abs(p.net))}</div></div>`).join(''):'<div class="muted">No tagged people.</div>')+`</div>`;
    const maxd=Math.max(1,...d.dow),todayI=(new Date().getDay()+6)%7;
    let dd=d.dow.map((v,i)=>({label:DOW[i],val:v,i}));
    const maxi=dd.reduce((a,b)=>b.val>a.val?b:a,dd[0]).i;
    if(DOWSORT)dd=dd.slice().sort((a,b)=>b.val-a.val);
    main+=`<div class="card"><div class="dowhdr"><div><div class="sec">Spending by day of week</div><div class="secsub">${esc(monLabel(d.month))} · hover a bar for its total</div></div><span class="dowtoggle" onclick="DOWSORT=!DOWSORT;render(DASH)">sort: ${DOWSORT?'Mon–Sun':'high → low'}</span></div>
      <div class="dow">${dd.map(x=>`<div class="c ${x.i===todayI?'hi':''} ${x.i===maxi?'max':''}" data-tip="${x.label} · ${window.hkMoney?window.hkMoney(x.val):('SAR '+money0(x.val))}${x.val>0?' · tap for transactions':''}" style="cursor:${x.val>0?'pointer':'default'}" ${x.val>0?`onclick="location.href='/?dow=${x.i}'+'${RQ}'"`:''}><span class="dv">${x.i===maxi&&x.val>0?'−'+money0(x.val):''}</span><b style="height:${Math.round(x.val/maxd*100)}%"></b><span>${x.label}</span></div>`).join('')}</div></div>`;
  }
  // right rail
  let side='';
  const dtot=cards.reduce((a,c)=>a+Math.abs(c.bal),0);
  if(cards.length){const cf=cardFront%cards.length,fr=cards[cf];
  side+=`<div class="card"><div class="stackhead"><div class="lbl">Cards</div><div class="amt amber" style="font-family:var(--mono);font-weight:800">SAR ${money0(dtot)}</div></div>
    <div class="cardstack"><div class="pcard front ${fr.bank||'CARD'}" onclick="location.href='/accounts?account='+encodeURIComponent('${esc(fr.name)}')">
      <div class="sheen"></div><div class="orn"><i></i><i></i></div>
      <div class="ptop"><span class="pbank">${esc(fr.bank||'')}${fr.brand?' '+esc(fr.brand):''}</span><span class="pnfc">))⟩</span></div>
      ${fr.network?`<div class="pnet">${netLabel(fr.network)}</div>`:''}
      <div class="pchip"></div>
      <div class="pnum">•••• •••• •••• ${esc(fr.last4||'')}</div>
      <div class="pfoot"><div class="pholder"><small>Card holder</small>Mohamed A.</div><div><small>Balance</small><span class="pbal">SAR ${money0(Math.abs(fr.bal))}</span></div></div></div>
      <div class="edges">${cards.map((c,i)=>i===cf?'':`<div class="edge ${c.bank||'CARD'}" onclick="event.stopPropagation();location.href='/accounts?account='+encodeURIComponent('${esc(c.name)}')" title="open on Accounts"><span>${esc(c.bank||'')} •${esc(c.last4||'')}</span><span class="ea">${money0(Math.abs(c.bal))}</span></div>`).join('')}</div>
    </div></div>`;}
  // recent activity
  side+=`<div class="card"><div class="sec">Recent activity</div><div class="secsub">last 5 ledger entries</div>`+((d.recent||[]).length?d.recent.map(r=>`<div class="trow" onclick="location.href='/?txn='+encodeURIComponent('${esc(String(r.id))}')">${hasCat(r.cat)?`<div class="pill" style="background:${cC(r.cat)}22;color:${cC(r.cat)}">${cI(r.cat)}</div>`:`<div class="avc" style="background:${avColor(r.name)}">${initials(r.name)}</div>`}<div class="mid"><div class="nm">${esc(r.name)}</div><div class="meta">${relTime(r.date)} · ${esc(r.date)} · ${esc(r.account||'')}</div></div><div class="amt ${r.signed>=0?'inc':'exp'}">${r.signed>=0?'+':'−'}${m(Math.abs(r.signed))}</div></div>`).join(''):'<div class="muted">None.</div>')+`</div>`;
  // (Upcoming payments removed by charter — due-soon/forward belongs to Today/Forecast, not the
  //  "where do I stand" dashboard. Bills live on /recurring; Committed on its own surface.)
  // completeness
  const cp=d.completeness;side+=`<div class="card"><div class="lbl">Data completeness · ${cp.pct}%</div><div class="compbar"><i style="width:${cp.pct}%"></i></div>`+cp.squares.map(s=>`<div class="sq ${s.done?'done':''}"><span class="mk">${s.done?'✓':'○'}</span><span style="flex:1">${esc(s.k)}</span>${s.note?`<span class="dim" style="font-family:var(--mono);font-size:11px">${esc(s.note)}</span>`:''}</div>`).join('')+`</div>`;
  document.getElementById('body').innerHTML=`<div class="grid"><div class="mainz">${main}</div><div class="side">${side}</div></div>`;
  setupChart();paintAlerts();}
function daysTo(ds){const d=Math.round((new Date(ds)-Date.now())/864e5);return d<=0?'due now':('in '+d+' days');}
async function loadRail(){try{const r=await(await fetch('/api/rail')).json();RAIL=r;
  document.getElementById('railcash').innerHTML=r.cash.map(c=>`<div class="acc" onclick="location.href='/account?account='+encodeURIComponent('${esc(c.name)}')"><span class="an">${esc(c.name)}</span><span class="av">${money0(c.bal)}</span></div>`).join('');
  document.getElementById('railcards').innerHTML=r.cards.map(c=>`<div class="acc crd" onclick="location.href='/?account='+encodeURIComponent('${esc(c.name)}')"><span class="an">${esc(c.bank||'')} •${esc(c.last4||'')}</span><span class="av">${money0(Math.abs(c.bal))}</span></div>`).join('');
  document.getElementById('cardtot').textContent='SAR '+money0(r.cards.reduce((a,c)=>a+Math.abs(c.bal),0));
  if(DASH&&DASH.net_worth!==undefined)render(DASH);}catch(e){}}
async function pollStatus(){try{const s=await(await fetch('/api/status')).json();
  const l=document.getElementById('rlive');l.className='live '+(s.sms_state==='live'?'':(s.sms_state==='amber'?'amber':'off'));l.querySelector('.t').textContent=s.sms_label||'SMS ?';
  const b=document.getElementById('rbackup');if(s.backup_ok){b.textContent='backup ✓';b.className='';}else{b.textContent='⚠ BACKUP FAILED';b.className='bad';}
  const bell=document.getElementById('bell');bell.querySelector('.dot')&&bell.querySelector('.dot').remove();if(!s.backup_ok){bell.insertAdjacentHTML('beforeend','<span class="dot"></span>');}}catch(e){}setTimeout(pollStatus,60000);}
async function qCount(){try{const q=await(await fetch('/api/queue')).json();const n=(q.merchants||[]).length+(q.onebyone||[]).length;
  document.getElementById('rqueue').textContent='QUEUE '+String(n).padStart(2,'0');const rq=document.getElementById('railq');rq.textContent=n;rq.style.display=n?'inline-block':'none';
  const bell=document.getElementById('bell');if(n>0&&!bell.querySelector('.dot'))bell.insertAdjacentHTML('beforeend','<span class="dot"></span>');}catch(e){}setTimeout(qCount,120000);}
function clock(){const el=document.getElementById('rclock');if(el)el.textContent=new Date().toTimeString().slice(0,8);setTimeout(clock,1000);}
let ALERTS={crit:[],chore:[],loaded:false};
async function renderAlerts(){
  // Dashboard charter: only operational health (needs-you-NOW) + money chores live here. Forward-looking
  // items — balloon-due, certificate income/maturity, committed-money — were REMOVED (they belong to
  // Today/Forecast; see BLOCKED.md). Critical (bad:1) show up top; chores collapse into one quiet line.
  let a=[];
  try{const s=await(await fetch('/api/status')).json();
    if(!s.backup_ok)a.push({bad:1,tag:'backup',ic:ic('alert'),t:'Backup failed — last nightly did not complete.',go:'check →',url:'/settings'});
    if(s.sms_state==='amber'||s.sms_state==='off')a.push({bad:0,tag:'SMS stale',ic:ic('info'),t:'SMS capture is stale — no recent heartbeat.',go:''});
  }catch(e){}
  try{const ag=await(await fetch('/api/agents')).json();
    (ag.agents||[]).filter(x=>x.ok===false||x.ok===null).forEach(x=>{
      const iv=x.interval_h?(x.interval_h>=24?Math.round(x.interval_h/24)+' days':x.interval_h+'h'):'its interval';
      a.push({bad:1,tag:'agent stalled',ic:ic('shield'),t:`Agent "${x.name}" hasn't run in ${iv}+ (${x.note}).`,go:'agents →',url:'/settings'});});
  }catch(e){}
  const qn=QN||{};const qc=(qn.merchants||[]).length+(qn.onebyone||[]).length;
  if(qc>0)a.push({bad:0,tag:'review queue',ic:ic('desk'),t:`${qc} transaction${qc>1?'s':''} waiting in the review queue.`,go:'open Desk →',url:'/'});
  try{const uc=await(await fetch('/api/unconfirmed')).json();
    if(uc.total>0)a.push({bad:0,tag:'confirm',ic:ic('info'),t:`${uc.total} transaction${uc.total>1?'s':''} still to confirm — ${uc.expenses} expenses · ${uc.income} income · ${uc.transfers} transfers.`,go:'confirm →',url:'/?confirm=1'});
  }catch(e){}
  try{const r=await(await fetch('/api/recurring')).json();const miss=r.count-r.amounts_set;
    if(miss>0)a.push({bad:0,tag:'bills unset',ic:ic('bulb'),t:`${miss} of ${r.count} bills have no amount set.`,go:'set them →',url:'/recurring'});
  }catch(e){}
  try{const P=await(await fetch('/api/positions')).json();
    if(P.stale_count>0)a.push({bad:0,tag:'stale values',ic:ic('chart'),t:`${P.stale_count} investment/metal position${P.stale_count>1?'s':''} not updated in 60+ days — refresh for an honest net worth.`,go:'holdings →',url:'/accounts'});
  }catch(e){}
  ALERTS={crit:a.filter(x=>x.bad),chore:a.filter(x=>!x.bad),loaded:true};
  paintAlerts();
}
// Paint from cache (called at the end of every render, so toggles/re-renders keep the line).
function paintAlerts(){
  const arow=x=>`<div class="alert ${x.bad?'bad':'warn'}" style="cursor:${x.url?'pointer':'default'}" ${x.url?`onclick="event.stopPropagation();location.href='${x.url}'"`:''}><span class="ai">${x.ic}</span><span class="agrow">${x.t}</span>${x.go?`<span class="ago">${x.go}</span>`:''}</div>`;
  const el=document.getElementById('alerts');       // critical → top, prominent (rare)
  if(el)el.innerHTML=ALERTS.crit.map(arow).join('');
  const c=document.getElementById('chores');        // chores → ONE quiet line, below money content
  if(!c)return;
  const n=ALERTS.chore.length;
  if(!n){c.innerHTML='';return;}
  c.innerHTML=`<div class="chorebar"><div class="chorehd" onclick="this.parentNode.classList.toggle('open')"><span class="cdot"></span><span class="ct">${n} thing${n>1?'s':''} to tidy</span><span class="cdim">${ALERTS.chore.map(x=>esc(x.tag)).join(' · ')}</span><span class="cx">show</span></div><div class="chorelist">${ALERTS.chore.map(arow).join('')}</div></div>`;
}
window.hakimReload=function(){load().then(renderAlerts);};load().then(renderAlerts);loadRail();pollStatus();qCount();clock();

/* ---- global ⌘K search palette ---- */
let PAL={items:[],idx:0,t:null};
function openPal(){const p=document.getElementById('pal');if(!p)return;p.classList.add('show');const i=document.getElementById('palq');i.value='';document.getElementById('pallist').innerHTML='';PAL={items:[],idx:0,t:null};setTimeout(()=>i.focus(),30);}
function closePal(){const p=document.getElementById('pal');if(p)p.classList.remove('show');}
function palSearch(){clearTimeout(PAL.t);const q=document.getElementById('palq').value;PAL.t=setTimeout(async()=>{if(!q.trim()){document.getElementById('pallist').innerHTML='';PAL.items=[];return;}try{const d=await(await fetch('/api/search?q='+encodeURIComponent(q))).json();PAL.items=d.results||[];PAL.idx=0;palRender();}catch(e){}},160);}
function palRender(){document.getElementById('pallist').innerHTML=PAL.items.map((r,i)=>`<div class="palrow ${i===PAL.idx?'on':''}" onmouseenter="PAL.idx=${i}" onclick="palGo(${i})"><span class="pi">${r.icon||'•'}</span><span class="pl"><div class="t">${esc(r.label)}</div><div class="s">${esc(r.sub||'')}</div></span><span class="pt">${esc(r.type)}</span></div>`).join('')||'<div class="palhint">No matches.</div>';}
function palGo(i){const r=PAL.items[i];if(r)location.href=r.target;}
function palKey(e){if(e.key==='Escape')closePal();else if(e.key==='ArrowDown'){e.preventDefault();PAL.idx=Math.min(PAL.items.length-1,PAL.idx+1);palRender();}else if(e.key==='ArrowUp'){e.preventDefault();PAL.idx=Math.max(0,PAL.idx-1);palRender();}else if(e.key==='Enter'){e.preventDefault();palGo(PAL.idx);}}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();openPal();}});
</script>
<div class="pal" id="pal" onclick="if(event.target.id==='pal')closePal()">
  <div class="palbox"><input id="palq" placeholder="Search transactions, categories, accounts, pages…" oninput="palSearch()" onkeydown="palKey(event)">
    <div class="pallist" id="pallist"></div>
    <div class="palhint">↑↓ navigate · ↵ open · esc close · ⌘K anywhere</div></div></div>
