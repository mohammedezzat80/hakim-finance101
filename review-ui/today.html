<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAKIM · Today</title>
<script src="/face.js"></script>
<link rel="stylesheet" href="/face.css">
<style>
:root{
 --bg:#0D0F16;--panel:#1B1F2C;--panel2:#232837;--line:#262B3A;--railbg:#0A0C12;
 --gold:#e8b95a;--gold2:#72D5C8;--teal:#72D5C8;--mint:#72D5C8;--red:#E05252;--amber:#e8b95a;
 --inc:#72D5C8;--exp:#D98A93;
 --txt:#FFFFFF;--lbl:#8A90A6;--muted:#5A6072;
 --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;--sans:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;
 --sp:24px;--rad:14px;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
a{color:inherit;text-decoration:none}
.rail{position:fixed;left:0;top:0;bottom:0;width:222px;z-index:40;background:var(--railbg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.brand{padding:2px 8px 16px;cursor:pointer}.brand .wm{font-family:var(--mono);font-size:15px;letter-spacing:2px;font-weight:800}
.brand .wm .sp{color:var(--gold)}.brand .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--lbl);font-weight:600;font-size:14.5px;cursor:pointer}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.85}.nav:hover{background:#1a1d23;color:var(--txt)}
.nav.active{background:rgba(114,213,200,.12);color:var(--gold2)}
.nav .qbadge{margin-left:auto;background:var(--mint);color:#0D0F16;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:800;font-family:var(--mono)}
.rsec{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#4b5260;margin:18px 10px 8px;display:flex}
.rsec .rt{margin-left:auto;color:var(--amber)}
.acc{display:flex;align-items:center;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.acc:hover{background:#1a1d23}.acc .an{flex:1;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.acc .av{font-family:var(--mono);font-weight:600}.acc.crd .av{color:var(--amber)}
.spacer{flex:1;min-height:12px}
.railstat{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.railstat .live{display:inline-flex;align-items:center;gap:7px;color:var(--teal)}
.railstat .live .d{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 7px var(--teal);animation:pul 2s infinite}
.railstat .live.off{color:var(--muted)}.railstat .live.off .d{background:var(--muted);box-shadow:none;animation:none}
.railstat .live.amber{color:var(--amber)}.railstat .live.amber .d{background:var(--amber)}
.railstat .bad{color:var(--red)}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
.app{max-width:1080px;padding:22px 28px 64px;margin-left:max(222px,calc((100% - 1080px)/2));margin-right:auto}
@media(max-width:900px){.rail{width:56px;padding:14px 6px}.brand .wm{font-size:0}.brand .wm::before{content:"✦";font-size:18px;color:var(--gold)}.brand .sub,.nav span:not(.qbadge),.rsec,.acc,.railstat{display:none}.nav{justify-content:center}.app{margin-left:56px}}
.topbar{display:flex;align-items:baseline;gap:14px;margin-bottom:var(--sp);flex-wrap:wrap}
.topbar h1{font-size:22px;font-weight:700;margin:0}.topbar .subtitle{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.card{background:linear-gradient(180deg,#1B1F2C,#151823);border:1px solid var(--line);border-radius:var(--rad);padding:20px 22px;margin-bottom:var(--sp)}
.lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lbl);font-weight:700}
.sec{font-size:13px;font-weight:700}.secsub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;margin-bottom:12px}
.cur{font-size:.42em;color:var(--muted);font-weight:400;margin-right:.12em;letter-spacing:.02em}.dec{font-size:.5em;color:var(--muted);font-weight:400;opacity:.7}
/* safe-to-spend hero */
.sts{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sts .hero-num{font-size:46px}
.sts .stsnote{font-size:12px;color:var(--muted);font-family:var(--mono);max-width:34ch;line-height:1.5}
.sts .stsbits{text-align:right;font-family:var(--mono);font-size:12px;color:var(--lbl);line-height:1.7}
.sts .stsbits b{color:var(--txt);font-weight:700}
/* day shape */
.shape{display:flex;gap:34px;flex-wrap:wrap;align-items:baseline}
.shape .n{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.5px}
.shape .s{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:4px}
/* rows */
.trow{display:flex;align-items:center;gap:12px;padding:9px 4px;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:none}
.trow .ic-wrap{width:30px;height:30px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--lbl);flex:none}
.trow .mid{flex:1;min-width:0}.trow .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .meta{font-size:11px;color:var(--muted);font-family:var(--mono)}
.trow .amt{font-family:var(--mono);font-weight:800;white-space:nowrap}
.amt.inc,.n.inc{color:var(--inc)}.amt.exp,.n.exp{color:var(--exp)}
.when{font-family:var(--mono);font-size:11px;color:var(--amber)}
.emptyface{padding:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp)}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.cbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--panel2);margin:10px 0 8px}
.cbar i{display:block;height:100%}
.cleg{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.cleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
</style>
</head>
<body>
<aside class="rail" id="hakim-rail"></aside>
<div class="app">
  <div class="topbar"><div><h1>Today</h1><div class="subtitle" id="subt">where you stand right now</div></div></div>
  <div id="body"><div class="secsub">Loading…</div></div>
</div>
<script>
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money0=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
function m(n){n=Number(n||0);const neg=n<0;n=Math.abs(n);const i=Math.floor(n).toLocaleString('en-US');const d=(n-Math.floor(n)).toFixed(2).slice(1);return `<span class="cur">SAR</span>${neg?'−':''}${i}<span class="dec">${d}</span>`;}
function when(x){return x.days===0?'today':x.days===1?'tomorrow':new Date(x.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
const IC=(n)=>window.ic?window.ic(n):'';

async function load(){
  let d;try{d=await(await fetch('/api/today')).json();}catch(e){document.getElementById('body').innerHTML='<div class="card">Could not load Today.</div>';return;}
  document.getElementById('subt').textContent=`${d.weekday} · ${d.date} · what’s due, what landed, what’s committed`;
  let h='';

  // ── Safe-to-spend (honest arithmetic, provisional label) ──
  const stsNeg=d.safe_to_spend<0;
  const prov = d.bills_unset>0
    ? `${IC('bulb')} <b>Provisional.</b> ${d.bills_unset} bill${d.bills_unset===1?'':'s'} still have no amount, so committed money — and this figure — is <b>understated</b>. <a href="/recurring" style="color:var(--gold2)">set amounts →</a>`
    : `${IC('info')} <b>Provisional.</b> This assumes committed money captures every obligation; it firms up as a full month is lived through.`;
  h+=`<div class="card"><div class="lbl">Safe to spend <span class="mattag">provisional</span></div>
    <div class="sts" style="margin-top:10px">
      <div><div class="hero-num ${stsNeg?'neg':''}">${m(d.safe_to_spend)}</div>
        <div class="stsnote" style="margin-top:8px">cash now − what’s still committed this month</div></div>
      <div class="stsbits">available cash <b>SAR ${money0(d.cash)}</b><br>still committed <b>SAR ${money0(d.committed_remaining)}</b></div>
    </div>
    <div class="matbanner" style="margin:16px 0 0">${prov}</div></div>`;

  // ── The day's shape ──
  h+=`<div class="card"><div class="sec">The day’s shape</div><div class="secsub">what has hit the ledger today</div>
    <div class="shape">
      <div><div class="n inc">+${m(d.day_in)}</div><div class="s">in today</div></div>
      <div><div class="n exp">−${m(d.day_out)}</div><div class="s">out today</div></div>
      <div><div class="n">${d.landed_count}</div><div class="s">entries today</div></div>
    </div></div>`;

  // ── Two columns: Due · Committed ──
  h+=`<div class="two">`;

  // Due (next 7 days) + Ahead
  h+=`<div class="card"><div class="sec">Due soon</div><div class="secsub">next 7 days · then the long lead</div>`;
  if(!d.due.length && !d.heads.length){
    h+=`<div class="emptyface"><div class="secsub" style="margin:0">Nothing due in the next 7 days. Clear runway.</div></div>`;
  }else{
    h+=d.due.map(x=>`<div class="trow"><div class="ic-wrap">${IC(x.kind==='bill'?'receipt':x.kind==='maturity'?'certificate':'card')}</div><div class="mid"><div class="nm">${esc(x.name)}</div><div class="meta">${x.kind}</div></div><div style="text-align:right"><div class="when">${when(x)}</div>${x.amount!=null?`<div class="amt">SAR ${money0(x.amount)}</div>`:''}</div></div>`).join('');
    h+=d.heads.map(x=>`<div class="trow"><div class="ic-wrap">${IC('clock')}</div><div class="mid"><div class="nm">${esc(x.name)}</div><div class="meta">ahead${x.urgent?' · set aside':''}</div></div><div style="text-align:right"><div class="when" style="color:${x.urgent?'var(--amber)':'var(--muted)'}">${esc(x.note||'')}</div>${x.amount!=null?`<div class="amt">SAR ${money0(x.amount)}</div>`:''}</div></div>`).join('');
  }
  h+=`</div>`;

  // Committed this month
  const bs=d.by_source||{}; const parts=[['bills','#7C9DFF'],['envelopes','#72D5C8'],['cards','#e8b95a'],['debt','#D98A93']];
  const ctot=parts.reduce((a,[k])=>a+(bs[k]||0),0)||1;
  h+=`<div class="card"><div class="sec">Committed this month</div><div class="secsub">${new Date(d.date+'T00:00:00').toLocaleDateString('en-GB',{month:'long'})} · already spoken for</div>
    <div class="shape" style="margin-bottom:4px"><div><div class="n exp">−${m(d.committed_total)}</div><div class="s">total committed</div></div><div><div class="n">−${m(d.committed_remaining)}</div><div class="s">still to leave</div></div></div>
    <div class="cbar">${parts.map(([k,c])=>bs[k]?`<i style="width:${(bs[k]/ctot*100)}%;background:${c}" data-tip="${k} · ${window.hkMoney?window.hkMoney(bs[k]):('SAR '+money0(bs[k]))}"></i>`:'').join('')}</div>
    <div class="cleg">${parts.map(([k,c])=>bs[k]?`<span><i style="background:${c}"></i>${k} ${money0(bs[k])}</span>`:'').join('')}</div>
    <div class="secsub" style="margin:12px 0 0"><a href="/recurring" style="color:var(--gold2)">manage bills →</a></div></div>`;

  h+=`</div>`; // /two

  // ── Landed today (full list) ──
  h+=`<div class="card"><div class="sec">Landed today</div><div class="secsub">${d.landed_count} entr${d.landed_count===1?'y':'ies'}</div>`;
  if(!d.landed.length){
    h+=`<div class="emptyface"><div class="secsub" style="margin:0">Nothing has hit the ledger yet today.</div></div>`;
  }else{
    h+=d.landed.map(r=>`<div class="trow" onclick="location.href='/?txn='+encodeURIComponent('${esc(String(r.id))}')" style="cursor:pointer"><div class="ic-wrap">${window.icFor?window.icFor(r.cat):IC('receipt')}</div><div class="mid"><div class="nm">${esc(r.name)}</div><div class="meta">${esc(r.account||'')}${r.cat?' · '+esc(r.cat):''}</div></div><div class="amt ${r.signed>=0?'inc':'exp'}">${r.signed>=0?'+':'−'}${m(Math.abs(r.signed))}</div></div>`).join('');
  }
  h+=`</div>`;

  document.getElementById('body').innerHTML=h;
}
load();
</script>
<script src="/rail.js"></script>
</body>
</html>
