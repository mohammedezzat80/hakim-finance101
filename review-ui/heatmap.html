<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAKIM · Spending heatmap</title>
<style>
:root{
 --bg:#0D0F16;--panel:#1B1F2C;--panel2:#232837;--line:#262B3A;--railbg:#0A0C12;
 --gold:#e8b95a;--gold2:#72D5C8;--teal:#72D5C8;--mint:#72D5C8;--mint2:#60B3A8;--red:#E05252;--amber:#b6bccb;
 --inc:#72D5C8;--exp:#D98A93;--trf:#9BA3C9;
 --txt:#FFFFFF;--lbl:#8A90A6;--muted:#5A6072;
 --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;--sans:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;
 --sp:24px;--rad:14px;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
a{color:inherit;text-decoration:none}
.rail{position:fixed;left:0;top:0;bottom:0;width:222px;z-index:40;background:var(--railbg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.brand{padding:2px 8px 16px}.brand .wm{font-family:var(--mono);font-size:15px;letter-spacing:2px;font-weight:800;color:var(--txt)}
.brand .wm .sp{color:var(--gold)}
.brand .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--lbl);font-weight:600;font-size:14.5px;cursor:pointer}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.85}.nav:hover{background:#1a1d23;color:var(--txt)}
.nav.active{background:rgba(114,213,200,.12);color:var(--gold2)}
.rsec{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#4b5260;margin:18px 10px 8px;display:flex}
.acc{display:flex;align-items:center;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.acc:hover{background:#1a1d23}.acc .an{flex:1;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.acc .av{font-family:var(--mono);font-weight:600;color:var(--txt)}
.spacer{flex:1;min-height:12px}
.railstat{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.railstat .live{display:inline-flex;align-items:center;gap:7px;color:var(--teal)}
.railstat .live .d{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 7px var(--teal);animation:pul 2s infinite}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
.app{max-width:1600px;padding:22px 28px 64px;margin-left:max(222px,calc((100% - 1600px)/2));margin-right:auto}
@media(max-width:480px){.app{padding:14px 10px 48px}.hmwrap{grid-template-columns:1fr}}
@media(max-width:900px){.rail{width:56px;padding:14px 6px}.brand .wm{font-size:0}.brand .wm::before{content:"✦";font-size:18px;color:var(--gold)}.brand .sub,.nav span:not(.qbadge),.rsec,.acc,.railstat{display:none}.nav{justify-content:center}.app{margin-left:56px}}
.cur{font-size:.6em;color:var(--muted);margin-right:3px;font-weight:600}.dec{font-size:.6em;color:var(--muted)}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:var(--sp)}
.topbar h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.beta{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:1px;color:#0D0F16;background:var(--amber);border-radius:6px;padding:2px 7px}
.topbar .subtitle{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.card{background:linear-gradient(180deg,#1B1F2C,#151823);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px}
.hmwrap{display:grid;grid-template-columns:8fr 4fr;gap:var(--sp);align-items:start}
.hmwrap>*{min-width:0}
@media(max-width:1120px){.hmwrap{grid-template-columns:1fr}}
.betanote{background:rgba(182,188,203,.06);border:1px solid rgba(182,188,203,.28);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--muted);margin-bottom:16px}
.hmscroll{overflow-x:auto;padding-bottom:6px}
.hmgrid{display:inline-grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px}
.hmgrid .cell{width:14px;height:14px;border-radius:3px;background:#171a22}
.hmmonths{display:flex;gap:4px;margin:0 0 6px 30px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.hmrow{display:flex;gap:10px}
.dowcol{display:grid;grid-template-rows:repeat(7,14px);gap:4px;font-family:var(--mono);font-size:9px;color:var(--muted);margin-right:6px;padding-top:0}
.dowcol span{height:14px;line-height:14px}
.legend{display:flex;align-items:center;gap:6px;margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.legend .cell{width:14px;height:14px;border-radius:3px}
.hmtip{position:fixed;background:#fff;color:#0D0F16;border-radius:8px;padding:5px 9px;font-family:var(--mono);font-size:11px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 6px 18px rgba(0,0,0,.5);white-space:nowrap;z-index:20}
.rt2{font-size:13px;font-weight:700;margin-bottom:2px}.rtsub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:12px}
.stt{display:flex;align-items:baseline;justify-content:space-between;padding:8px 0;font-size:13px}.stt+.stt{border-top:1px solid var(--line)}
.stt .k{color:var(--lbl)}.stt .v{font-family:var(--mono);font-weight:700}
.muted{color:var(--muted)}.notice{color:var(--muted);font-size:13px;padding:20px 4px;font-family:var(--mono);text-align:center}
/* global ⌘K search palette */
.pal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal.show{display:flex}
.palbox{width:min(620px,92vw);background:#151823;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.palbox input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--txt);font-size:16px;padding:16px 18px;outline:none;font-family:var(--sans)}
.pallist{max-height:52vh;overflow-y:auto}
.palrow{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer}
.palrow.on,.palrow:hover{background:var(--panel2)}
.palrow .pi{width:26px;text-align:center;font-size:15px}
.palrow .pl{flex:1;min-width:0}.palrow .pl .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.palrow .pl .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
.palrow .pt{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
.palhint{padding:10px 18px;font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<aside class="rail" id="hakim-rail"></aside>
<div class="app">
  <div class="topbar">
    <div><h1>Spending heatmap <span class="beta">BETA</span></h1><div class="subtitle">daily spending intensity · darker = more spent that day</div></div>
  </div>
  <div class="hmwrap">
    <div class="card">
      <div class="betanote" id="betanote"></div>
      <div id="hm"><div class="notice">Loading…</div></div>
    </div>
    <div class="card"><div class="rt2">This range</div><div class="rtsub">what the map is made of</div><div id="stats"></div></div>
  </div>
</div>
<div class="hmtip" id="hmtip"></div>
<script>
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money0=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let DATA=null;
function iso(d){return d.toISOString().slice(0,10);}
function level(out,max){if(!out||out<=0)return 0;const f=out/max;return f<=0.15?1:f<=0.4?2:f<=0.7?3:4;}
const LVLC=['#171a22','rgba(217,138,147,.28)','rgba(217,138,147,.5)','rgba(217,138,147,.74)','#D98A93'];
async function load(){
  DATA=await(await fetch('/api/heatmap')).json();
  document.getElementById('betanote').innerHTML=`⚠️ <b>Beta.</b> Only ${DATA.total_days_with_data} days of ledger data so far — the map reads more like a sketch than a pattern. It firms up as weeks accumulate.`;
  render();renderStats();
}
function render(){
  const hm=document.getElementById('hm');
  if(!DATA.from){hm.innerHTML=`<div class="notice">No spending yet to map.</div>`;return;}
  const start=new Date(DATA.from+'T00:00:00');start.setDate(start.getDate()-start.getDay()); // back to Sunday
  const end=new Date((DATA.to||DATA.today)+'T00:00:00');end.setDate(end.getDate()+(6-end.getDay())); // fwd to Saturday
  const max=DATA.max||1;
  let cells='',months='',lastMo=-1;const weeks=[];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const k=iso(d),out=DATA.days[k]||0,cnt=DATA.counts[k]||0,lv=level(out,max);
    cells+=`<div class="cell" style="background:${LVLC[lv]}" data-d="${k}" data-o="${out}" data-c="${cnt}" onmousemove="tip(event)" onmouseleave="hideTip()"></div>`;
  }
  // month labels: walk weeks (every 7 cells is a column); label when month changes
  const nCells=Math.round((end-start)/864e5)+1,nWeeks=Math.ceil(nCells/7);
  for(let w=0;w<nWeeks;w++){const d=new Date(start);d.setDate(d.getDate()+w*7);const mo=d.getMonth();
    months+=`<div style="width:14px">${mo!==lastMo?d.toLocaleDateString('en-GB',{month:'short'}):''}</div>`;lastMo=mo;}
  hm.innerHTML=`<div class="hmmonths">${months}</div>
    <div class="hmrow"><div class="dowcol">${DOW.map((d,i)=>`<span>${i%2?d:''}</span>`).join('')}</div>
      <div class="hmscroll"><div class="hmgrid">${cells}</div></div></div>
    <div class="legend">less ${LVLC.map(c=>`<span class="cell" style="background:${c}"></span>`).join('')} more</div>`;
}
function tip(e){const el=e.currentTarget,t=document.getElementById('hmtip');const out=+el.dataset.o,c=+el.dataset.c;
  const dt=new Date(el.dataset.d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  t.innerHTML=`<b>${dt}</b> · ${out>0?'SAR '+money0(out):'no spending'}${c?(' · '+c+' txn'+(c===1?'':'s')):''}`;
  t.style.opacity=1;t.style.left=Math.min(window.innerWidth-t.offsetWidth-8,e.clientX+12)+'px';t.style.top=(e.clientY-34)+'px';}
function hideTip(){document.getElementById('hmtip').style.opacity=0;}
function renderStats(){
  const days=DATA.days,ks=Object.keys(days);
  const total=ks.reduce((a,k)=>a+days[k],0);
  const active=ks.filter(k=>days[k]>0).length;
  const busiest=ks.sort((a,b)=>days[b]-days[a])[0];
  const avg=active?total/active:0;
  document.getElementById('stats').innerHTML=
    `<div class="stt"><span class="k">Total spent</span><span class="v exp">−${money0(total)}</span></div>
     <div class="stt"><span class="k">Days with spending</span><span class="v">${active}</span></div>
     <div class="stt"><span class="k">Busiest day</span><span class="v">${busiest?new Date(busiest+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' · '+money0(days[busiest]):'—'}</span></div>
     <div class="stt"><span class="k">Avg / active day</span><span class="v">${money0(avg)}</span></div>`;
}
async function loadRail(){try{const r=await(await fetch('/api/rail')).json();
  document.getElementById('railcash').innerHTML=r.cash.map(c=>`<div class="acc" onclick="location.href='/account?account='+encodeURIComponent('${esc(c.name)}')"><span class="an">${esc(c.name)}</span><span class="av">${money0(c.bal)}</span></div>`).join('');}catch(e){}}
async function pollStatus(){try{const s=await(await fetch('/api/status')).json();const l=document.getElementById('rlive');l.className='live '+(s.sms_state==='live'?'':(s.sms_state==='amber'?'amber':'off'));l.querySelector('.t').textContent=s.sms_label||'SMS ?';const b=document.getElementById('rbackup');b.textContent=s.backup_ok?'backup ✓':'⚠ BACKUP FAILED';}catch(e){}setTimeout(pollStatus,60000);}
function clock(){const el=document.getElementById('rclock');if(el)el.textContent=new Date().toTimeString().slice(0,8);setTimeout(clock,1000);}
load();loadRail();pollStatus();clock();

/* ---- global ⌘K search palette ---- */
let PAL={items:[],idx:0,t:null};
function openPal(){const p=document.getElementById('pal');if(!p)return;p.classList.add('show');const i=document.getElementById('palq');i.value='';document.getElementById('pallist').innerHTML='';PAL={items:[],idx:0,t:null};setTimeout(()=>i.focus(),30);}
function closePal(){const p=document.getElementById('pal');if(p)p.classList.remove('show');}
function palSearch(){clearTimeout(PAL.t);const q=document.getElementById('palq').value;PAL.t=setTimeout(async()=>{if(!q.trim()){document.getElementById('pallist').innerHTML='';PAL.items=[];return;}try{const d=await(await fetch('/api/search?q='+encodeURIComponent(q))).json();PAL.items=d.results||[];PAL.idx=0;palRender();}catch(e){}},160);}
function palRender(){document.getElementById('pallist').innerHTML=PAL.items.map((r,i)=>`<div class="palrow ${i===PAL.idx?'on':''}" onmouseenter="PAL.idx=${i}" onclick="palGo(${i})"><span class="pi">${r.icon||'•'}</span><span class="pl"><div class="t">${esc(r.label)}</div><div class="s">${esc(r.sub||'')}</div></span><span class="pt">${esc(r.type)}</span></div>`).join('')||'<div class="palhint">No matches.</div>';}
function palGo(i){const r=PAL.items[i];if(r)location.href=r.target;}
function palKey(e){if(e.key==='Escape')closePal();else if(e.key==='ArrowDown'){e.preventDefault();PAL.idx=Math.min(PAL.items.length-1,PAL.idx+1);palRender();}else if(e.key==='ArrowUp'){e.preventDefault();PAL.idx=Math.max(0,PAL.idx-1);palRender();}else if(e.key==='Enter'){e.preventDefault();palGo(PAL.idx);}}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();openPal();}});
</script>
<div class="pal" id="pal" onclick="if(event.target.id==='pal')closePal()">
  <div class="palbox"><input id="palq" placeholder="Search transactions, categories, accounts, pages…" oninput="palSearch()" onkeydown="palKey(event)">
    <div class="pallist" id="pallist"></div>
    <div class="palhint">↑↓ navigate · ↵ open · esc close · ⌘K anywhere</div></div></div>
<script src="/rail.js"></script>
</body>
</html>
