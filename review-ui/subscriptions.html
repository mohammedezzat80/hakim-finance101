<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAKIM · Subscriptions</title>
<script src="/face.js"></script>
<link rel="stylesheet" href="/face.css">
<style>
:root{
 --bg:#0D0F16;--panel:#1B1F2C;--panel2:#232837;--line:#262B3A;--railbg:#0A0C12;
 --gold:#e8b95a;--gold2:#72D5C8;--teal:#72D5C8;--mint:#72D5C8;--red:#E05252;--amber:#e8b95a;
 --inc:#72D5C8;--exp:#D98A93;
 --txt:#FFFFFF;--lbl:#8A90A6;--muted:#5A6072;
 --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;--sans:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;
 --sp:24px;--rad:14px;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
a{color:inherit;text-decoration:none}
.rail{position:fixed;left:0;top:0;bottom:0;width:222px;z-index:40;background:var(--railbg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.brand{padding:2px 8px 16px;cursor:pointer}.brand .wm{font-family:var(--mono);font-size:15px;letter-spacing:2px;font-weight:800}
.brand .wm .sp{color:var(--gold)}.brand .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--lbl);font-weight:600;font-size:14.5px;cursor:pointer}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.85}.nav:hover{background:#1a1d23;color:var(--txt)}
.nav.active{background:rgba(114,213,200,.12);color:var(--gold2)}
.nav .qbadge{margin-left:auto;background:var(--mint);color:#0D0F16;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:800;font-family:var(--mono)}
.rsec{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#4b5260;margin:18px 10px 8px;display:flex}
.rsec .rt{margin-left:auto;color:var(--amber)}
.acc{display:flex;align-items:center;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.acc:hover{background:#1a1d23}.acc .an{flex:1;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.acc .av{font-family:var(--mono);font-weight:600}.acc.crd .av{color:var(--amber)}
.spacer{flex:1;min-height:12px}
.railstat{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.railstat .live{display:inline-flex;align-items:center;gap:7px;color:var(--teal)}
.railstat .live .d{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 7px var(--teal);animation:pul 2s infinite}
.railstat .live.off{color:var(--muted)}.railstat .live.off .d{background:var(--muted);box-shadow:none;animation:none}
.railstat .live.amber{color:var(--amber)}.railstat .live.amber .d{background:var(--amber)}
.railstat .bad{color:var(--red)}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
.app{max-width:1080px;padding:22px 28px 64px;margin-left:max(222px,calc((100% - 1080px)/2));margin-right:auto}
@media(max-width:900px){.rail{width:56px;padding:14px 6px}.brand .wm{font-size:0}.brand .wm::before{content:"✦";font-size:18px;color:var(--gold)}.brand .sub,.nav span:not(.qbadge),.rsec,.acc,.railstat{display:none}.nav{justify-content:center}.app{margin-left:56px}}
.topbar{display:flex;align-items:baseline;gap:14px;margin-bottom:var(--sp);flex-wrap:wrap}
.topbar h1{font-size:22px;font-weight:700;margin:0}.topbar .subtitle{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.card{background:linear-gradient(180deg,#1B1F2C,#151823);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;margin-bottom:var(--sp)}
.lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lbl);font-weight:700}
.sec{font-size:13px;font-weight:700}.secsub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;margin-bottom:12px}
.cur{font-size:.42em;color:var(--muted);font-weight:400;margin-right:.12em}.dec{font-size:.5em;color:var(--muted);opacity:.7}
.strip{display:flex;gap:34px;flex-wrap:wrap;align-items:baseline}
.strip .n{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.5px}
.strip .n.hero-num{font-family:var(--face-display);font-size:34px}
.strip .s{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:4px}
.trow{display:flex;align-items:center;gap:12px;padding:9px 4px;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:none}
.trow .ic-wrap{width:30px;height:30px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--lbl);flex:none}
.trow .mid{flex:1;min-width:0}.trow .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .meta{font-size:11px;color:var(--muted);font-family:var(--mono)}
.trow .amt{font-family:var(--mono);font-weight:800;white-space:nowrap;text-align:right}
.noamt{color:var(--amber);font-family:var(--mono);font-size:11px;font-weight:600}
.when{font-family:var(--mono);font-size:11px;color:var(--muted)}
.two{display:grid;grid-template-columns:3fr 2fr;gap:var(--sp)}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.emptyface{padding:20px}
.prop{border:1px solid rgba(114,213,200,.3);background:rgba(114,213,200,.05)}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--lbl)}
.chip.det{color:var(--gold2);border:1px solid rgba(114,213,200,.3)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--gold2);border-radius:8px;padding:5px 11px;font-size:11px;font-family:var(--mono);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold2)}
</style>
</head>
<body>
<aside class="rail" id="hakim-rail"></aside>
<div class="app">
  <div class="topbar"><div><h1>Subscriptions</h1><div class="subtitle">what recurs · declared + detected · monthly commitment</div></div></div>
  <div id="body"><div class="secsub">Loading…</div></div>
</div>
<script>
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money0=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
function m(n){n=Number(n||0);const neg=n<0;n=Math.abs(n);const i=Math.floor(n).toLocaleString('en-US');const d=(n-Math.floor(n)).toFixed(2).slice(1);return `<span class="cur">SAR</span>${neg?'−':''}${i}<span class="dec">${d}</span>`;}
const IC=(n)=>window.ic?window.ic(n):'';
function nextLbl(x){const dt=x.date||x.next_due;if(!dt)return '';if(x.days===0)return 'today';if(x.days===1)return 'tomorrow';return new Date(dt+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});}

async function load(){
  let d;try{d=await(await fetch('/api/subscriptions')).json();}catch(e){document.getElementById('body').innerHTML='<div class="card">Could not load Subscriptions.</div>';return;}
  let h='';

  // summary
  h+=`<div class="card"><div class="lbl">Monthly recurring commitment</div>
    <div class="strip" style="margin-top:10px">
      <div><div class="n hero-num exp">−${m(d.monthly_total)}</div><div class="s">per month · declared + detected</div></div>
      <div><div class="n">${d.declared_count}</div><div class="s">declared bills</div></div>
      <div><div class="n">${d.undeclared.length}</div><div class="s">detected, undeclared</div></div>
    </div>
    ${d.unpriced>0?`<div class="matbanner" style="margin:16px 0 0">${IC('bulb')} <b>${d.unpriced} declared bill${d.unpriced===1?'':'s'} have no amount</b> — the monthly total is honest but <b>incomplete</b> until they’re priced. <a href="/recurring" style="color:var(--gold2)">set amounts →</a></div>`:''}
  </div>`;

  h+=`<div class="two">`;

  // Left: declared inventory
  h+=`<div class="card"><div class="sec">Declared inventory</div><div class="secsub">your recurring bills · amount when set</div>`;
  h+=d.declared.length?d.declared.map(x=>`<div class="trow"><div class="ic-wrap">${IC('receipt')}</div><div class="mid"><div class="nm">${esc(x.name)}</div><div class="meta">${esc(x.freq||'recurring')}${x.next_due?' · next '+nextLbl(x):''}</div></div><div class="amt">${x.known?m(x.monthly)+'<div class="meta" style="text-align:right">/mo</div>':'<span class="noamt">no amount</span>'}</div></div>`).join('')
    :`<div class="emptyface"><div class="secsub" style="margin:0">No recurring bills declared yet. <a href="/recurring" style="color:var(--gold2)">manage bills →</a></div></div>`;
  h+=`</div>`;

  // Right: next-charge calendar
  h+=`<div class="card"><div class="sec">Next charges</div><div class="secsub">soonest first</div>`;
  h+=d.calendar.length?d.calendar.map(x=>`<div class="trow"><div class="mid"><div class="nm">${esc(x.name)}</div><div class="meta">${nextLbl(x)}</div></div><div class="amt">${x.amount!=null?'SAR '+money0(x.amount):'<span class="noamt">—</span>'}</div></div>`).join('')
    :`<div class="emptyface"><div class="secsub" style="margin:0">No dated charges yet.</div></div>`;
  h+=`</div></div>`;

  // Detected / undeclared proposals
  h+=`<div class="card ${d.undeclared.length?'prop':''}"><div class="sec">Detected recurring · not yet declared</div><div class="secsub">merchants that recur in your ledger — declare them to track the commitment</div>`;
  if(!d.undeclared.length){
    h+=`<div class="emptyface"><div class="secsub" style="margin:0">Nothing recurring found outside your declared bills. Detection sharpens as months complete.</div></div>`;
  }else{
    h+=d.undeclared.map(x=>`<div class="trow"><div class="ic-wrap">${IC('cart')}</div><div class="mid"><div class="nm">${esc(x.name)} <span class="chip det">seen ${x.months_seen} mo${x.stable?' · stable':''}</span></div><div class="meta">≈ SAR ${money0(x.monthly)}/mo · last ${esc(x.last_date||'')}</div></div><a class="btn" href="/recurring">＋ declare as bill</a></div>`).join('');
  }
  h+=`</div>`;

  // Watching (price-creep / unused) — maturity-gated
  h+=`<div class="card"><div class="sec">Price-creep &amp; unused watch</div>
    ${window.matBanner(d.maturity,'Creep &amp; unused detection')}
    <div class="secsub" style="margin:0">Watching since <b>${esc(d.watching_since)}</b>. Once ${d.maturity.need} months complete, this flags subscriptions whose price crept up or that you stopped using. Nothing to report yet — that’s honest, not empty.</div></div>`;

  document.getElementById('body').innerHTML=h;
}
load();
</script>
<script src="/rail.js"></script>
</body>
</html>
