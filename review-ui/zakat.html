<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAKIM · Zakat</title>
<script src="/face.js"></script>
<link rel="stylesheet" href="/face.css">
<style>
:root{
 --bg:#0D0F16;--panel:#1B1F2C;--panel2:#232837;--line:#262B3A;--railbg:#0A0C12;
 --gold:#e8b95a;--gold2:#72D5C8;--teal:#72D5C8;--mint:#72D5C8;--red:#E05252;--amber:#e8b95a;
 --inc:#72D5C8;--exp:#D98A93;
 --txt:#FFFFFF;--lbl:#8A90A6;--muted:#5A6072;
 --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;--sans:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;
 --sp:24px;--rad:14px;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
a{color:inherit;text-decoration:none}
.rail{position:fixed;left:0;top:0;bottom:0;width:222px;z-index:40;background:var(--railbg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.brand{padding:2px 8px 16px;cursor:pointer}.brand .wm{font-family:var(--mono);font-size:15px;letter-spacing:2px;font-weight:800}
.brand .wm .sp{color:var(--gold)}.brand .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--lbl);font-weight:600;font-size:14.5px;cursor:pointer}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.85}.nav:hover{background:#1a1d23;color:var(--txt)}
.nav.active{background:rgba(114,213,200,.12);color:var(--gold2)}
.nav .qbadge{margin-left:auto;background:var(--mint);color:#0D0F16;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:800;font-family:var(--mono)}
.rsec{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#4b5260;margin:18px 10px 8px;display:flex}
.rsec .rt{margin-left:auto;color:var(--amber)}
.acc{display:flex;align-items:center;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.acc:hover{background:#1a1d23}.acc .an{flex:1;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.acc .av{font-family:var(--mono);font-weight:600}.acc.crd .av{color:var(--amber)}
.spacer{flex:1;min-height:12px}
.railstat{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.railstat .live{display:inline-flex;align-items:center;gap:7px;color:var(--teal)}
.railstat .live .d{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 7px var(--teal);animation:pul 2s infinite}
.railstat .live.off{color:var(--muted)}.railstat .live.off .d{background:var(--muted);box-shadow:none;animation:none}
.railstat .live.amber{color:var(--amber)}.railstat .live.amber .d{background:var(--amber)}
.railstat .bad{color:var(--red)}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
.app{max-width:980px;padding:22px 28px 64px;margin-left:max(222px,calc((100% - 980px)/2));margin-right:auto}
@media(max-width:900px){.rail{width:56px;padding:14px 6px}.brand .wm{font-size:0}.brand .wm::before{content:"✦";font-size:18px;color:var(--gold)}.brand .sub,.nav span:not(.qbadge),.rsec,.acc,.railstat{display:none}.nav{justify-content:center}.app{margin-left:56px}}
.topbar{display:flex;align-items:baseline;gap:14px;margin-bottom:var(--sp);flex-wrap:wrap}
.topbar h1{font-size:22px;font-weight:700;margin:0}.topbar .subtitle{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.card{background:linear-gradient(180deg,#1B1F2C,#151823);border:1px solid var(--line);border-radius:var(--rad);padding:20px 22px;margin-bottom:var(--sp)}
.lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lbl);font-weight:700}
.sec{font-size:13px;font-weight:700}.secsub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;margin-bottom:12px}
.cur{font-size:.4em;color:var(--muted);font-weight:400;margin-right:.12em}.dec{font-size:.5em;color:var(--muted);opacity:.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp)}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.nisbar{height:12px;border-radius:7px;background:var(--panel2);overflow:hidden;margin:12px 0 6px;position:relative}
.nisbar i{display:block;height:100%;background:var(--mint)}.nisbar i.under{background:var(--amber)}
.nismark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold2)}
.trow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.trow:first-of-type{border-top:none}.trow .pl{color:var(--lbl)}.trow .pv{font-family:var(--mono);font-weight:700}
.big{font-family:var(--face-display);font-size:34px;font-weight:600;letter-spacing:-.02em}
.stat{display:flex;gap:30px;flex-wrap:wrap;align-items:baseline}
.stat .n{font-family:var(--mono);font-size:20px;font-weight:800}.stat .s{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:4px}
.emptyface{padding:18px 0}
</style>
</head>
<body>
<aside class="rail" id="hakim-rail"></aside>
<div class="app">
  <div class="topbar"><div><h1>Zakat</h1><div class="subtitle">hawl · zakatable base · nisab · the 2.5% — computed, never guessed</div></div></div>
  <div id="body"><div class="secsub">Loading…</div></div>
</div>
<script>
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money0=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
function m(n){n=Number(n||0);const neg=n<0;n=Math.abs(n);const i=Math.floor(n).toLocaleString('en-US');const d=(n-Math.floor(n)).toFixed(2).slice(1);return `<span class="cur">SAR</span>${neg?'−':''}${i}<span class="dec">${d}</span>`;}
const IC=(n)=>window.ic?window.ic(n):'';

async function load(){
  let d;try{d=await(await fetch('/api/zakat')).json();}catch(e){document.getElementById('body').innerHTML='<div class="card">Could not load Zakat.</div>';return;}
  let h='';

  // honest-empty banner about positions
  if(!d.has_positions){
    h+=`<div class="matbanner">${IC('info')} <b>This is your cash zakatable base only.</b> Enter your certificates, HISSAR balances, gold and funds (<a href="/accounts" style="color:var(--gold2)">Accounts → + New ▾ → Investment</a>) and count your cash — then your true zakatable base appears here.</div>`;
  }

  // zakatable base + nisab check
  const pct=d.nisab?Math.min(100,Math.round(d.zakatable_total/d.nisab*100)):0;
  h+=`<div class="card"><div class="lbl">Zakatable base</div>
    <div class="big" style="margin-top:8px">${m(d.zakatable_total)}</div>
    <div class="nisbar"><i class="${d.above?'':'under'}" style="width:${pct}%"></i><span class="nismark" style="left:${d.nisab?Math.min(100,100):100}%"></span></div>
    <div class="secsub" style="margin:0">${d.above?`${IC('check')} <b style="color:var(--mint)">At or above nisab</b> (SAR ${money0(d.nisab)})`:`${IC('info')} <b style="color:var(--amber)">Below nisab</b> — your zakatable wealth (SAR ${money0(d.zakatable_total)}) is under the nisab of SAR ${money0(d.nisab)}${d.nisab_estimated?' (estimated)':''}. No zakat is due below this line.`}</div>
    ${d.nisab_estimated?`<div class="secsub" style="margin:8px 0 0">Nisab is an <b>estimate</b> (${d.gold_grams}g gold × SAR ${d.gold_price}/g). <a href="/settings" style="color:var(--gold2)">Set your verified nisab</a> from the gold price on your hawl day for an exact line.</div>`:''}
  </div>`;

  h+=`<div class="two">`;

  // parts breakdown
  h+=`<div class="card"><div class="sec">What counts</div><div class="secsub">liquid + monetary wealth · property & valuables excluded</div>`;
  if(d.parts&&d.parts.length){h+=d.parts.map(p=>`<div class="trow"><span class="pl">${esc(p.name)} <span class="secsub" style="display:inline;margin:0">${esc(p.kind)}</span></span><span class="pv">SAR ${money0(p.balance)}</span></div>`).join('');
    h+=`<div class="trow" style="border-top:2px solid var(--line);margin-top:4px"><span class="pl"><b>Zakatable total</b></span><span class="pv" style="color:var(--gold2)">SAR ${money0(d.zakatable_total)}</span></div>`;}
  else{h+=`<div class="emptyface secsub" style="margin:0">No zakatable accounts found yet.</div>`;}
  h+=`</div>`;

  // hawl status
  h+=`<div class="card"><div class="sec">Hawl · the lunar year</div><div class="secsub">zakat is due after one full lunar year continuously at/above nisab</div>`;
  if(d.above){
    h+=`<div class="stat"><div><div class="n">${d.hawl_start?esc(d.hawl_start):'starting'}</div><div class="s">hawl start</div></div><div><div class="n ${d.lunar_year_complete?'inc':''}">${d.lunar_year_complete?'complete':'in progress'}</div><div class="s">lunar year</div></div></div>`;
    if(d.lunar_year_complete){h+=`<div class="card" style="margin:14px 0 0;background:rgba(114,213,200,.06);border-color:rgba(114,213,200,.3)"><div class="lbl">Zakat due (2.5%)</div><div class="big inc" style="margin-top:6px">${m(d.zakat_due_now)}</div><div class="secsub" style="margin:6px 0 0">of your zakatable base. Record the payment once given.</div></div>`;}
    else{h+=`<div class="secsub" style="margin:10px 0 0">The daily hawl tracker is watching your balance stays above nisab. If it dips below, the year restarts — that’s the rule, honestly applied.</div>`;}
  }else{
    h+=`<div class="emptyface secsub" style="margin:0">The hawl hasn’t started — your zakatable wealth is below nisab today. It begins the day your wealth crosses and stays above the line. The tracker records every day (since ${esc(d.first_tracked||'now')}, ${d.records||0} days) so the moment is caught exactly.</div>`;
  }
  h+=`</div></div>`;

  document.getElementById('body').innerHTML=h;
}
load();
</script>
<script src="/rail.js"></script>
</body>
</html>
