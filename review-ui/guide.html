<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAKIM · Guide</title>
<script src="/face.js"></script>
<link rel="stylesheet" href="/face.css">
<style>
:root{
 --bg:#0D0F16;--panel:#1B1F2C;--panel2:#232837;--line:#262B3A;--railbg:#0A0C12;
 --gold:#e8b95a;--gold2:#72D5C8;--mint:#72D5C8;--red:#E05252;--amber:#e8b95a;
 --inc:#72D5C8;--exp:#D98A93;--txt:#FFFFFF;--lbl:#8A90A6;--muted:#5A6072;
 --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;--sans:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;
 --sp:24px;--rad:14px;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
a{color:inherit;text-decoration:none}
.rail{position:fixed;left:0;top:0;bottom:0;width:222px;z-index:40;background:var(--railbg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.brand{padding:2px 8px 16px;cursor:pointer}.brand .wm{font-family:var(--mono);font-size:15px;letter-spacing:2px;font-weight:800}.brand .wm .sp{color:var(--gold)}
.brand .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--lbl);font-weight:600;font-size:14.5px;cursor:pointer}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.85}.nav:hover{background:#1a1d23;color:var(--txt)}.nav.active{background:rgba(114,213,200,.12);color:var(--gold2)}
.spacer{flex:1;min-height:12px}.railstat{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.app{max-width:900px;padding:22px 28px 64px;margin-left:max(222px,calc((100% - 900px)/2));margin-right:auto}
@media(max-width:900px){.rail{width:56px;padding:14px 6px}.brand .wm{font-size:0}.brand .wm::before{content:"✦";font-size:18px;color:var(--gold)}.brand .sub,.nav span,.railstat{display:none}.nav{justify-content:center}.app{margin-left:56px}}
@media(max-width:480px){.app{padding:14px 12px 48px}}
.topbar{margin-bottom:var(--sp)}.topbar h1{font-size:23px;font-weight:700;margin:0}.topbar .subtitle{font-size:12.5px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px}
.tab{background:var(--panel2);border:1px solid var(--line);color:var(--lbl);border-radius:20px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:var(--mono)}
.tab.on{background:rgba(114,213,200,.14);border-color:transparent;color:var(--mint)}
.gsearch{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px 15px;font-size:14px;margin-bottom:20px;font-family:var(--sans)}
.grp{margin-bottom:26px}
.grp>h2{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--gold2);margin:0 0 12px;font-family:var(--mono)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.cards{grid-template-columns:1fr}}
.recipe{background:linear-gradient(180deg,#1B1F2C,#151823);border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px}
.recipe h3{font-size:15px;margin:0 0 3px;display:flex;align-items:center;gap:8px}
.recipe .rw{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:10px}
.recipe ol{margin:0;padding-left:18px}
.recipe li{font-size:13.5px;line-height:1.65;margin-bottom:5px;color:var(--lbl)}
.recipe li b{color:var(--txt);font-weight:600}
.k{font-family:var(--mono);font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--txt)}
.doct{background:linear-gradient(180deg,#141a24,#10141d);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;margin-bottom:14px}
.doct h3{margin:0 0 6px;font-size:15px;color:var(--gold2)}
.doct p{margin:0;font-size:13.5px;line-height:1.7;color:var(--lbl)}
.doct p b{color:var(--txt)}
.hero{background:linear-gradient(180deg,#1B2530,#141b24);border:1px solid var(--line);border-radius:var(--rad);padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero .h{font-size:14px;font-weight:600}.hero .s{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.hero a{margin-left:auto;background:rgba(114,213,200,.14);border:1px solid rgba(114,213,200,.4);color:var(--mint);border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:700;font-family:var(--mono)}
.none{color:var(--muted);font-family:var(--mono);font-size:12px;padding:20px;text-align:center}
</style>
</head>
<body>
<aside class="rail" id="hakim-rail"></aside>
<div class="app">
  <div class="topbar"><h1>؟ Guide</h1><div class="subtitle">how to do things · how HAKIM thinks · what's new — written to match the system as it actually is</div></div>

  <div class="hero"><div><div class="h">📣 What changed recently?</div><div class="s">a plain-language log, straight from the build record</div></div><a href="/changelog">What's new →</a></div>

  <input class="gsearch" id="q" placeholder="🔎 search recipes — e.g. split, envelope, bill, net worth…" oninput="render()">
  <div class="tabs" id="tabs"></div>
  <div id="body"></div>
</div>
<script>
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Recipes describe the system AS IT IS. Each step names the real surface. Staged features are omitted.
const R=[
 // ---------- DAILY ----------
 {g:'Daily',t:'Add a transaction (expense · income · transfer)',i:'✍️',steps:['Open the composer from anywhere it’s offered — the <b>Desk → Add</b> tab, or <b>＋ Add on this date</b> on the <b>Calendar</b>. It’s one designed sheet, same everywhere.','At the top, pick the <b>date</b> and the type: <b>🧾 Expense · 💰 Income · ⇄ Transfer</b> — the form below changes to match.','<b>Amount is the star:</b> tap it out on the keypad — math works (<span class="k">120+35</span> evaluates to 155). The currency shows above it.','<b>Expense:</b> pick the account it came from, a category (search the tree), the <b>person</b> who spent it (chips), and the merchant. <b>Income:</b> the account it landed in + source. <b>Transfer:</b> from- and to-accounts — pick <b>any</b> account including a card or loan, and it tells you “counts as a payment toward this debt”.','<b>More…</b> holds reference, tags, note when you need them. <b>Save</b>, or <b>Save &amp; add another</b> to keep going in a batch. It lands verified — no review needed for things you typed yourself.']},
 {g:'Daily',t:'Split a receipt',i:'✂️',steps:['On the <b>Desk</b>, open the transaction (e.g. a 2,000 Zara).','Tap <b>✂️ Split this into multiple lines</b>.','On each line type the <b>amount</b> (math like <span class="k">120+35</span> works), pick a <b>category</b> (and sub), tap the <b>person</b> chips.','Use <b>assign rest</b> on the last line to fill the remainder in one tap.','When <b>Remainder</b> reads SAR 0, hit <b>Save split</b>. The statement still shows one charge; your categories show each share.']},
 {g:'Daily',t:'Confirm transactions',i:'🔵',steps:['On the <b>Desk</b>, open the <b>Confirm</b> tab — everything not yet verified by you (white).','Filter by type with the chips: <b>Expenses · Income · Transfers</b>.','Tap <b>Confirm one at a time</b> to walk them, or <b>Select</b> to bulk-confirm a run you trust.','Each becomes green as you verify it.']},
 {g:'Daily',t:'Make a rule from a transaction',i:'⚡',steps:['On the <b>Desk</b>, open a transaction from a merchant you recognise.','Set its category (and person/class if needed).','Tick <b>always apply to this merchant</b> before saving.','It becomes a live rule in the <b>Rules</b> tab — future and existing matches follow it.']},
 // ---------- MONTHLY ----------
 {g:'Monthly',t:'Manage bills + set all amounts',i:'🔁',steps:['Open <b>Recurring</b>.','Click any bill (or its <b>set amount</b>) to edit name, amount, schedule, active — all in-app.','For your whole list, use <b>✎ Set all amounts</b> at the top: type each, then <b>Save all</b>.','Amounts light up the monthly total, the Calendar dots and the dashboard.']},
 {g:'Monthly',t:'Build & save a report',i:'📊',steps:['Open <b>Reports</b>.','Tap a <b>preset</b> (Zakat base, Sadaqah, Business-vs-personal…) or build your own: type, date range, group-by, filters.','<b>Account &amp; category filters have one-tap shortcuts</b> — <b>Select all · Clear</b>, plus groups (<b>Wallets · Bank accounts · Cards · Mohamed’s · Sarah’s</b> for accounts; <b>Expenses · Income · With-targets</b> for categories). Leaving a filter untouched means <b>all</b> — the header says so (“All accounts”).','Hit <b>Run report</b>. Switch chart style with the toggles.','For the whole picture at a glance, pick type <b>Flow (Sankey)</b> — a ribbon diagram of <b>income → categories → saved</b> for the period (and if you outspent income, an honest <b>“drawn from reserves”</b> band shows where the gap came from).','Tap <b>★ Save</b> to name it for one-click reruns.']},
 {g:'Monthly',t:'Export your ledger',i:'📤',steps:['Open <b>Reports</b> and run any report.','Use <b>CSV</b> (detail), <b>PDF</b> (summary) or <b>QIF</b> (for other finance apps).','Exports respect the current filters and date range.']},
 {g:'Monthly',t:'Use the Rules manager',i:'⚙️',steps:['Open <b>Rules</b>. The top of the page is <b>💡 Rule proposals</b> — recurring merchants that have no rule yet, ranked highest-impact first, so the system asks you to teach it your world at your pace.','On each proposal card you see the merchant, how many times it recurred, whose account(s) it’s on, the total, and sample dates. Set a <b>category → subcategory</b>, tap the <b>person</b> chip(s) who spent it, add optional tags.','<b>✓ Confident</b> builds the rule and applies it to existing matches immediately — settled forever. <b>? Not sure yet</b> builds <b>nothing</b> and snoozes the merchant until it recurs a couple more times (“appeared 2 more times since you deferred — sure now?”) — never a wrong rule from thin evidence. <b>Dismiss</b> silences a genuine one-off.','Below proposals: <b>Migrate</b> your import patterns into Firefly’s engine (one button), <b>Test</b> a rule to preview matches (read-only), <b>Apply</b> runs it across existing transactions, <b>Create</b> makes one from scratch.']},
 {g:'Monthly',t:'Set a budget target (or from history)',i:'🎯',steps:['Open <b>Categories → ✎ Manage</b> — each row shows the <b>full category name</b> + its state as chips (target · envelope · type · colour). Fastest path: tap the <b>target chip</b> to edit just the target inline.','For everything else, tap <b>✎</b> on the row to open its editor. Under <b>Budget target</b>, type an amount + pick a <b>period</b>.','Not sure of a number? Tap <b>⟲ from history</b> to load your own <b>last / 3-mo / 6-mo</b> average (only windows you actually have appear), then <b>Set</b>.','Under <b>Type</b>, mark it <b>🔒 Fixed</b> or <b>🌊 Flexible</b> — the summary then shows the fixed-vs-flexible split.']},
 {g:'Money concepts',t:'Read "committed this month"',i:'📌',steps:['On the <b>Categories</b> summary (and <b>Recurring</b>), <b>Committed</b> = money already spoken for this month: bills due this month + envelope contributions (+ loan/lease/BNPL once added).','Bills are counted in their <b>real</b> month — a quarterly or school bill lands in its month, never smeared.','It’s a fact about obligations, <b>not</b> "what’s left to spend" — that guidance waits for the intelligence layer. (The Dashboard stays "where you stand" — committed is a forward view, so it lives here, not there.)','Set your bill amounts (Recurring → Set all amounts) to light it up.']},
 // ---------- FIXING MISTAKES ----------
 {g:'Fixing mistakes',t:'Edit a transaction',i:'✎',steps:['On the <b>Desk</b>, open the transaction.','Expand <b>✎ Edit details</b>.','Change amount, date, description or account.','Save — an honest audit note is added (e.g. “edited by Mohamed: amount 150→161”). Bank reference stays read-only.']},
 {g:'Fixing mistakes',t:'Remove a wrong transaction',i:'🗑',steps:['Open the transaction → <b>✎ Edit details</b>.','If you typed it yourself: <b>Delete</b> (type DELETE to confirm).','If it came from the bank: <b>Exclude</b> — it stays on the statement (bank truth) but drops out of all totals, flagged as an error. You can restore it later.']},
 {g:'Fixing mistakes',t:'Bulk-fix many at once',i:'☑︎',steps:['On the <b>Desk</b> (All or Confirm), tap <b>☑︎ Select</b>.','Tick the rows you want.','Use the bottom bar: <b>Categorise · Person · Class · Verify</b>.','One action applies to all selected — each is undoable.']},
 {g:'Fixing mistakes',t:'Spread a big expense across months (⑂)',i:'⑂',steps:['Open the expense on the <b>Desk</b> → <b>✎ Edit details</b> → <b>⑂ Spread across months</b>.','Enter how many months (e.g. annual insurance ÷ 12).','<b>Categories &amp; Reports</b> now show 1/N per month — so one big bill doesn’t spike a single month.','The ledger keeps the <b>one true entry</b>; enter 1 to un-spread. Rows carry a small ⑂ marker.']},
 {g:'Household',t:'Match a BNPL card charge to its plan',i:'⛓',steps:['When a Tabby/Tamara charge appears on the <b>Desk</b>, open it.','If it matches an open plan, a chip offers: <b>“Discharge installment 2 of 4 on … plan?”</b>','One tap links it — the charge <b>pays down the debt</b> instead of being counted as a new expense.','Unmatched charges are left plainly for you to decide — never auto-assumed.']},
 // ---------- MONEY CONCEPTS ----------
 {g:'Money concepts',t:'Read your net worth',i:'📈',steps:['On the <b>Dashboard</b>, the big number is assets minus debts.','A <b>negative</b> figure (below the zero line) means debts exceed assets today — normal while cards carry balances.','Toggle <b>Net worth ⇄ Debt remaining</b> to flip the lens.','The line chart shows the trend month to month.']},
 {g:'Money concepts',t:'Set an envelope + read recovery',i:'🧧',steps:['Open <b>Categories → ✎ Manage</b>, tap <b>✎</b> on a category, then <b>🧧 Make an envelope</b>.','Enter a monthly contribution and start date. Available = what accumulated minus what you spent.','If it goes <b>negative</b> it turns rose and shows a recovery date (“at 1,000/mo → back to zero Dec 2028”) — pure arithmetic, no nagging.','For a due-dated goal (school fees), add a target + due month: it shows the monthly amount needed.']},
 {g:'Money concepts',t:'Cleared vs available balance',i:'✓',steps:['Open <b>Accounts</b>, tap an account.','<b>Available</b> = the live balance. <b>Cleared</b> = only what you’ve reconciled against the statement.','Mark a transaction reconciled on its Desk card (✓ Reconciled against statement) to move it into Cleared.']},
 {g:'Money concepts',t:'Card registry — add · edit · link · expiry',i:'💳',steps:['On <b>Accounts</b>, the <b>🗂 Card registry</b> lists every card (credit + mada debit) by last-4 · owner · network · tier · <b>expiry</b>, sorted by whichever dies soonest.','<b>Add or edit any card yourself</b> — tap <b>➕ Add card</b> on the registry (or <b>🗂 Registry</b> inside a card account’s detail). One panel sets <b>last-4 · owner · network · type · tier · expiry · linked account</b>; <b>✎</b> re-opens it to change any field; <b>Delete</b> (type the last-4 to confirm) forgets a stray card — it never touches a real account.','<b>Privacy principle — we never store a full card number.</b> Last-4 + expiry + owner only: the system identifies cards perfectly by their last-4, and a full number stored anywhere is pure risk with zero benefit.','Set each card’s <b>expiry (MM/YY)</b> from the card face — you get an <b>amber alert 60 days</b> before it dies, <b>red at 30</b> (“card •8381 expires soon — watch for the replacement”), so a card never expires unnoticed and strands an autopay.','<b>Links show both ways:</b> a real credit-card account auto-links by last-4 (its account name shows on the card); a mada/debit card you link to its bank account by hand. Per card also: <b>network</b> (Visa/MC/mada, verified) · <b>credit limit</b> (utilization bar: amber >70, rose >90, red over) · <b>tier</b> note.']},
 {g:'Money concepts',t:'Card payment contract (due date & amount)',i:'💳',steps:['Open <b>Accounts</b> → a card → <b>✎ Card settings</b> — enter the facts from your bank app.','<b>Payment mode:</b> Full amount, or Minimum (a % with a floor — banks charge whichever is higher). <b>Due rule:</b> “Day N of next month” (SNB: the 5th) or “Last day of the month” (SABB) — per card.','The card then shows <b>“Due {date}: SAR X”</b> computed from your live balance — full outstanding, or max(% , floor) in minimum mode. It joins <b>committed-money</b> and the <b>Calendar</b> dot in its true month, so the bank’s knock never surprises you.','Minimum mode shows a quiet honesty line (the rest carries forward) — a fact, not advice; optimal-payment coaching stays gated until there’s a real surplus.']},
 // ---------- HOUSEHOLD ----------
 {g:'Household',t:'Add, hide or merge an account',i:'🏦',steps:['Open <b>Accounts</b>.','<b>+ Add account</b> to create one (cash, bank, card, gold, receivable…).','Open an account for <b>Hide</b> (removes from views, keeps history) or <b>Merge…</b> (folds it into another — nothing erased).','Drag ⠿ to reorder.']},
 {g:'Household',t:'See one account’s transactions',i:'🚪',steps:['Open <b>Accounts</b>, tap an account to expand it.','Tap <b>All N transactions in … →</b>.','It opens the Desk filtered to just that account.']},
 {g:'Household',t:'Add an investment, certificate or gold',i:'📊',steps:['Open <b>Accounts → + Add account</b>.','Pick a type under <b>Investments &amp; metals</b> — certificate (شهادة), fund, ETF, gold, silver, HISSAR, or company equity.','Enter its current value + the <b>as-of date</b>; for a certificate you can set <b>restricted until</b> (maturity).','It appears in <b>Holdings</b>; certificates count in net worth but show as <b>🔒 restricted</b>, so available-vs-total wealth stays honest. Tap <b>update</b> monthly to refresh the value.']},
 {g:'Household',t:'Track a loan — the SAMA amortization table',i:'🏦',steps:['Add the loan under <b>Accounts → + Add → Financing → Loan (Tawarruq)</b>, open it → <b>Set up loan schedule</b>: financed amount · <b>annual profit rate</b> · term · start (monthly is computed on declining-balance, editable if the contract differs).','You get the table <b>SAMA requires</b>: # · date · payment · <b>profit</b> · <b>principal</b> · <b>balance after</b> — profit computed on the shrinking balance, so early payments are profit-heavy. The <b>◆ crossover row</b> marks where principal overtakes profit — the answer to “when does the interest stop mattering”.','Header shows the loan’s life: paid (principal/profit) · remaining · next payment with its split · <b>total cost</b> (“100,000 → 109,519 · cost 9,519”).','<b>⚖️ Settle-today estimate</b> (SAMA formula): balance + next 3 months’ profit — an honest ballpark; your bank’s figure is final. Each recorded payment’s profit feeds the <b>Riba lens</b>.']},
 {g:'Household',t:'Lease walk-away map — the exits the bank doesn’t advertise',i:'🚪',steps:['On a lease → <b>⚙ Set exit terms</b>: your contract’s early-termination clause (free text) · whether returning the car instead of paying the balloon is allowed at contract end · any handback fee · optional car resale-value estimate.','The <b>🚪 If I exit here</b> map shows, per month, what stopping there means per <b>your contract’s own words</b> (never a guess): committed remaining + your clause, honestly labelled “company’s figure is final”.','The final row shows <b>both endings</b>: pay the balloon → own it (worth ~your estimate) · or return the car → balloon waived — the resale-risk arbitrage, computed from your numbers.','Honest note built in: Saudi leases allow the end-of-contract return; <b>mid-term exit is your contract’s terms, not a legal right</b>, and handback may not discharge everything.']},
 {g:'Household',t:'Buy on Tabby / Tamara (BNPL) — the whole life',i:'🛍️',steps:['<b>Create:</b> Accounts → <b>🛍️ New Tabby/Tamara plan</b> — name · total · start · installments · <b>category</b> (required — e.g. Travel) · <b>person</b> (optional — Sarah, Seif…). HAKIM divides the total (468 ÷ 4 = 117) and builds the schedule. <b>The plan carries its meaning:</b> every installment (checkout, linked, or manually settled) files itself under that category + person, so Categories and By-person stay true without another thought. Change it anytime with <b>🏷 Category · person</b> on the card (it re-tags past payments too) — the category is chosen from your <b>live category list</b> (same picker as the Desk, always current, no typing). The card’s <b>🧳 category · 👤 person</b> badges are <b>clickable</b>: tap to jump straight to that category (filtered to this plan’s payments) or the person’s spending — see exactly where your installments landed.','<b>Tabby/Tamara charge installment 1 at checkout</b> — so it asks <b>which card</b> paid that first one. It books <b>only that installment as spending</b> (117), and you <b>owe the rest</b> (351). Your month shows what actually left your card — never the full plan as one lump.','<b>Each later installment is spending in the month it’s charged</b> — open the charge on the <b>Calendar/Desk</b> and link it to the plan (or an auto-matched SMS does it). The remaining debt drops; your spending reflects the real cash, month by month.','<b>Can’t link one?</b> Use <b>“Settle manually…”</b> on that installment — for a charge that <b>predates your ledger</b>, was <b>paid by someone else</b>, or was <b>paid outside tracked accounts</b>. It reduces the debt with a non-cash adjustment (your tracked money never moves) and shows a distinct <b>SETTLED ✓ (manual — reason)</b> pill — visibly manual, forever, next to the mint <b>PAID</b> of real linked charges.','<b>The plan is a schedule timeline</b> (like your Tabby app) — one card per installment with its date; next is highlighted, future sit quiet. <b>Reminders</b> ride along (Calendar dot · Upcoming · committed-money).','<b>Truth:</b> “paid” only ever counts <b>real connected charges</b>; manual settlements are always tagged manual. <b>When the last settles</b>, the plan <b>auto-retires</b> to “Completed plans”.']},
 {g:'Household',t:'Track a certificate (شهادة) — profit-first',i:'📜',steps:['Add it under <b>Accounts → + New ▾ → 📜 Investment → certificate</b>: name + bank, currency, <b>principal</b> (opening balance), <b>annual rate %</b>, <b>rate type</b> (fixed, or variable/dynamic with a kept history), <b>payout frequency</b> (monthly · quarterly · half-year · yearly), and a <b>term</b> (1 / 3 / 5 yr or custom) — the maturity date fills itself.','Open the certificate to see it <b>profit-first</b>: the top is the living income story — <b>Next profit: {date} · ≈{amount} (as contracted)</b> and how much you’ve <b>collected so far</b> of the total to maturity.','Below is the <b>profit stream</b> — every payout dated. When a real deposit matches one it flips to <b>RECEIVED ✓</b>; a past payout with no deposit yet shows amber <b>“expected — not yet received”</b>; future ones stay quiet.','The <b>principal</b> sits calmly underneath as <b>🔒 locked until maturity</b> — it counts in net worth as restricted, never as spendable. The final card is maturity: <b>principal released — renew or collect</b>, with a one-month-ahead alert.','Variable rate changed? Open the certificate → <b>✎ Rate</b>, enter the new rate + the date it takes effect. Past payouts stay as received; only future expectations recompute, and the old rate is kept in the visible history.','These same per-certificate payout dates drive the <b>💰 dots on the Calendar</b> and the <b>expected certificate income this month</b> figure — one schedule, everywhere.']},
 {g:'Household',t:'Track your Alfursan miles',i:'✈️',steps:['On <b>Accounts</b>, the <b>✈ Saudia Alfursan</b> card holds your miles — <b>not money, never in net worth</b> (miles value swings by redemption, so we never guess a SAR figure).','Once a month, tap <b>✎ Update</b> and type the <b>balance</b> + the <b>nearest batch expiry</b> straight from the Saudia app (their numbers, exactly — Alfursan miles die in <b>batches</b>, so the app shows the soonest one).','The card shows an <b>estimate</b> of miles earned this month from your Alfursan cards’ spend (spend ÷ your earn rate) — <b>context only, never added</b>. If the app shows fewer, some didn’t post → <b>Claim missing Miles</b> in the app.','Expiry turns <b>amber 6 months out, red at 3</b> — “use or lose”. Each monthly entry is kept, drawing a miles-over-time line. Your <b>Travel</b> fund shows these miles beside the SAR you save — both ways you fund a trip, together.']},
 {g:'Household',t:'Track a fund / ETF — enter the price, see how you’re doing',i:'📊',steps:['Add it under <b>Accounts → + New ▾ → 📜 Investment → fund/ETF</b>: name + manager/ticker · currency (any — global) · <b>units held</b> · <b>purchase price per unit</b> (→ cost basis) · <b>type</b>: <b>Distributing</b> (pays dividends as cash) or <b>Accumulating</b> (reinvests inside — growth is all in the price). One-line explainer on each.','Each month, open the fund and use <b>“This month’s price”</b> — type the unit price you see and <b>Save</b>. It stamps the date (editable for corrections), revalues your holding, and adds a row to the history. Missed months simply stay blank — never guessed.','The card leads with <b>Your capital: {value} · {+X%} total return since purchase</b>, then a <b>month-by-month table</b> (price · value · % vs purchase · % vs previous) and a small line chart from the same points.','It shows <b>price return vs total return</b>: price return is how the unit price moved; <b>total return</b> adds the dividends you received — for a distributing fund the price alone <b>understates</b> your gain (price drops when it pays out), so total return is your true performance.','<b>Distributing dividends:</b> tap <b>＋ Dividend</b> → <b>cash</b> (lands in an account as “Investment income: funds/ETFs”) or <b>reinvested</b> (buys more units at that day’s price — units and cost basis grow). Accumulating funds show no dividend surface — it’s already inside the price.','<b>Sell</b> (partial or full) via the buy/sell shape states the realised gain plainly (“sold 50 units: cost 5,000 → received 6,200, gain +1,200”). Everything counts in Holdings + the hawl zakatable base.']},
 {g:'Household',t:'Set up a car lease (with the balloon)',i:'🚗',steps:['On <b>Accounts</b> tap <b>🚗 New lease</b>: car value · down payment · <b>balloon</b> (final payment) · term · contract monthly · first-due · which account pays the down.','It books the car into <b>Other assets</b> at value, the lease liability at the <b>full remaining commitment</b> (monthly × term + balloon), and the down payment out of cash — with a balance proof.','The <b>balloon is a named scheduled item</b> on the lease detail, not a surprise — you see it on the schedule timeline well ahead of its date.','Record each monthly payment on the lease detail; it discharges the commitment.']},
 {g:'Household',t:'Buy or sell gold, a fund or an ETF',i:'📈',steps:['On <b>Accounts</b>, find the position in <b>Holdings</b>.','Tap <b>＋</b> to buy more (money moves from a cash account into it) or <b>−</b> to sell (even partially — value moves back to cash).','Each is a balance-proven transfer, not an expense — it’s your money changing shape.','Tap <b>update</b> monthly to refresh the position’s current value.']},
 {g:'Household',t:'Zakat / Hawl tracking',i:'🌙',steps:['Open <b>Settings</b> — the <b>Zakat · Hawl</b> line records nightly whether your wealth is above nisab.','Set your verified nisab there (until then an 85g-gold estimate is used, clearly flagged).','It <b>calculates no zakat</b> — it only builds the daily record so a future hawl date is knowable. The clock can’t be backfilled, which is why it runs now.']},
 {g:'Household',t:'Split a shared order — قطة Qattah',i:'قطة',steps:['You paid a shared order (McDonald’s, the office coffee run). Open that expense on the <b>Desk</b> → <b>قطة Split this shared order</b>.','Pick who else was in from your <b>inner circle</b> (add a name to grow the circle) → <b>÷ Equal</b> (divides by everyone incl. you) or <b>✎ Custom</b> (type each; the rest is automatically your share).','Three truths at once: the <b>full amount</b> stays out of your account (cash truth) · only <b>your share</b> stays as food in your analysis (consumption truth) · each other person’s share becomes a <b>receivable</b> tagged قطة (owed-to-you truth). Balance-proven.','See each person’s tab on <b>Owed to me</b> — the قطة lens filters to just shared-order debts; a person’s card shows the origin breakdown (“qattah 250 · loan 50”).']},
 {g:'Household',t:'Track money you lent (Owed to me)',i:'🤝',steps:['Open <b>Owed to me</b> in the sidebar.','Tap <b>＋ Lend money</b>: who, how much, from which account. It posts a <b>real transfer</b> — the cash leaves your account and becomes a receivable, so net worth stays exact.','When they pay you back, tap <b>Record repayment</b> on their card — the money returns to your chosen account and their outstanding drops. Each shows a balance proof.','Cards show <b>aging</b> (“3mo ago”). If your “Owed to me” account already held a balance, tap <b>Attribute existing balance</b> to label who it belongs to — no money moves.']},
 {g:'Household',t:'Count your cash (wallets & safes)',i:'🧮',steps:['On <b>Accounts</b> tap <b>🧮 Count cash</b>.','Type what you physically counted in each wallet/safe — each in its own currency (SAR, USD, EGP…). Leave blank to skip.','Any difference from the book balance posts an adjustment stamped <b>“counted {date}”</b>, with a per-line proof that the account now equals your count.','Each account then shows <b>last counted</b> and turns amber after 45 days — so you know what’s fresh. Great to do alongside your papers evening.']},
 {g:'Money concepts',t:'Save toward a season (Ramadan / Eid / school)',i:'🌙',steps:['Open <b>Goals → ＋ New goal</b>.','Under <b>Deadline</b> choose <b>🌙 By season</b> and pick Ramadan · Eid al-Fitr · Eid al-Adha · School start.','HAKIM sets the date to the <b>next occurrence</b> (Umm al-Qura), and every time you open Goals it rolls forward automatically.','The card shows <b>SAR X/mo to hit it</b> — plain arithmetic (what’s left ÷ months left) — plus 25/50/75% milestone ticks. No coaching.']},
 {g:'Money concepts',t:'See your cost of debt (riba & fees)',i:'💸',steps:['Open <b>Reports</b> and tap the <b>💸 Cost of debt (riba &amp; fees)</b> preset.','It gathers every <b>financing cost</b> your loans, leases and BNPL plans booked — the real numbers, not an estimate.','You get the <b>total</b>, an <b>average per month</b>, a <b>per-card / per-loan breakdown</b> (bars) and a <b>6-month trend</b> (line).','Empty until you record financing that carries a cost — then it fills itself. It’s a mirror, not advice.']},
 {g:'Fixing mistakes',t:'Link two transactions (refund / reimbursement)',i:'🔗',steps:['Open a transaction on the <b>Desk</b>.','Under <b>Linked transactions</b>, pick the relationship (relates / refunds / pays for / reimburses) and search the other transaction.','It shows as a readable line (“(partially) refunds …”); tap ✕ to unlink.','Great for pairing a refund with its original, or a reimbursement with the expense.']},
 {g:'Monthly',t:'Mark a bill paid this month',i:'✅',steps:['Open <b>Recurring</b>.','Each bill shows <b>expected</b> or <b>paid</b> — HAKIM auto-matches by name, and you can tap the pill to set it yourself.','Paid bills drop out of <b>Committed</b> (only the unpaid remainder is still “spoken for”) and their <b>Calendar</b> dot turns green.']},
 {g:'Monthly',t:'Compare two months / see budget history',i:'⇄',steps:['On <b>Categories</b>, tap <b>⇄ Compare</b> — pick any two months to see per-category spending side by side, biggest movers first.','Tap <b>▦ History</b> for the target-vs-actual grid across recent months (✓ within target, ✗ over).','Both are honest — they only show months you actually have data for.']},
 {g:'Monthly',t:'Budget by the Hijri month · strict vs carry',i:'🌙',steps:['On <b>Categories → ✎ Manage</b>, tap <b>✎</b> on a category — its <b>Budget target</b> period can be set to <b>hijri month</b> (for Ramadan and seasonal spending).','In the same editor, <b>Rollover</b> sets its posture: <b>↻ Carry unspent</b> rolls forward; <b>🔒 Strict reset</b> zeroes the budget each month.']},
 {g:'Household',t:'A bill with irregular dates (school fees)',i:'📆',steps:['Open <b>Recurring</b>, edit the bill, expand <b>📆 Irregular instalments</b>.','Add each real <b>date + amount</b> (e.g. three school payments across the year) — one bill, not three fakes.','Each lands on its own day in the <b>Calendar</b> and counts in <b>Committed</b> only in its true month.','Tap <b>🧧 Make a sinking fund</b> to save monthly toward the total.']},
 {g:'Household',t:'Group a trip’s spending',i:'🧳',steps:['Open any transaction on the <b>Desk</b> and type a name in the <b>🧳 Trip</b> box (e.g. “Umrah 2026”).','Tag every transaction from that journey the same way.','<b>Reports</b> shows a <b>Trips</b> panel totalling each journey’s spend and dates.']},
 {g:'Fixing mistakes',t:'Fix how a merchant is named',i:'🏷️',steps:['Open <b>Settings → Merchant map</b>.','Find the rule (or <b>+ add rule</b>): a match pattern → a clean name + category.','Editing it fixes every <b>future</b> import (past transactions are untouched). This is where a mislabel like “Seif STC” gets corrected for good.']},
 // ---------- GETTING AROUND ----------
 {g:'Getting around',t:'The “refresh” pill & ⓘ explainers',i:'🔄',steps:['When a new SMS transaction (or an edit made elsewhere) lands, a <b>🔄 refresh</b> pill appears — tap it to pull the change into the open page. No manual reload.','Small <b>ⓘ</b> marks explain a concept in place — tap one for a plain-language definition of committed money, net worth, envelopes, strict-vs-carry and more.']},
 {g:'Getting around',t:'Ask Finance & search',i:'🔎',steps:['Press <span class="k">⌘J</span> anywhere for <b>Ask Finance</b> — questions about your money.','Press <span class="k">⌘K</span> for search — jump to any transaction, category, account or page.']},
 {g:'Getting around',t:'What the grey SOON tabs mean',i:'🌫️',steps:['Items in the sidebar’s <b>Coming in waves</b> list are planned, not built.','They’re shown honestly so nothing half-works — tapping one explains what it will be and what it’s waiting on.','Everything above the divider is live and real.']},
 {g:'Getting around',t:'When an alert appears',i:'🔔',steps:['The <b>Dashboard</b> keeps money first: anything <b>critical</b> (backup failed, an agent hasn’t run) shows at the top; everyday <b>chores</b> (queue to review, items to confirm, bills without amounts) collapse into one quiet <b>“N things to tidy”</b> line below the money — tap <b>show</b> to expand.','Each alert links to the exact place to fix it.','A missing weekly health line is itself the alarm — silence means check the agents in Settings.']},
 {g:'Daily',t:'Read your Today page',i:'☀',steps:['Open <b>Today</b> — it answers "where do I stand right now": what’s due, what landed, what’s committed.','<b>Safe to spend</b> = cash now − what’s still committed this month. It’s marked <b>provisional</b> and stays that way until your bills all carry amounts (an unpriced bill makes committed money — and this number — understated).','<b>Due soon</b> lists the next 7 days and the long-lead heads-up (balloon, maturity, card expiry). <b>Committed this month</b> breaks down bills · envelopes · cards · debt.','<b>Landed today</b> is every entry that hit the ledger today — tap one to open it on the Desk.','This page grows more sure of itself as months complete — where a claim needs more history, a banner names the exact date it unlocks.']},
 {g:'Monthly',t:'Set budgets the easy way',i:'◐',steps:['Open <b>Budget</b> — your <b>manual targets</b> (with a progress bar vs this month’s spend) on top, and <b>proposed targets</b> drawn from what you actually spend below.','Each proposal is the <b>average</b> of that category across your complete months, with the monthly figures shown as evidence — tap <b>set SAR X/mo</b> to accept it (editable later).','Proposals are <b>provisional</b> until 3 months complete — a two-month average is a starting point, not a verdict; they firm up on 30 September.','Every target writes to the same one place, so Budget, Categories and committed-money always agree.']},
 {g:'Money concepts',t:'Read your Insights',i:'💡',steps:['Open <b>Insights</b> — it surfaces <b>only</b> patterns your data actually supports, and shows the sample behind each (e.g. “across 10 weeks…”).','<b>Coming into focus</b> lists the patterns that need more history — each names the exact date it unlocks. Trend and anomaly finders come alive once 3 months complete.','It never dresses an estimate as a pattern. With a young ledger, “nothing qualifies yet” is the correct, honest answer.','<b>Go deeper</b> links to the Money-flow Sankey (Reports) and recurring detection (Subscriptions) rather than duplicating them.']},
 {g:'Money concepts',t:'Compute your Zakat',i:'☾',steps:['Open <b>Zakat</b> — your <b>zakatable base</b> (liquid + monetary wealth; property and valuables excluded), checked against the <b>nisab</b>.','Below nisab, <b>no zakat is due</b> and the hawl hasn’t started — the daily tracker watches for the day your wealth crosses and stays above the line.','Above nisab for a full <b>lunar year</b>, it computes the <b>2.5%</b> due. Set your <b>verified nisab</b> (85g gold on your hawl day) in Settings for an exact line — it’s an estimate until then.','Enter your certificates, HISSAR balances and gold (Accounts → + New ▾ → Investment) so the base is your <b>true</b> zakatable wealth, not just cash.']},
 {g:'Money concepts',t:'See your whole Wealth',i:'◆',steps:['Open <b>Wealth</b> — your <b>whole</b> net worth, <b>allocation</b> (where assets sit), <b>currency exposure</b>, and what’s <b>restricted</b>.','Until your investments are entered it shows cash and bank only — add certificates, HISSAR, gold and funds and the allocation fills in across every class and country.','<b>Performance</b> (time-weighted &amp; annualized return, allocation drift) computes <b>only from your own entered prices</b> — no market data, no benchmarks. It opens once your positions carry a cost basis and a current value.']},
 {g:'Money concepts',t:'Use the Debt coach',i:'💳',steps:['Open <b>Debt coach</b> — every card and financing you owe, the <b>order to attack</b> it, and the <b>minimums you must never miss</b>.','<b>Avalanche</b> pays the highest-rate debt first (cheapest overall); <b>Snowball</b> pays the smallest balance first (fastest wins) — toggle between them.','<b>The floor:</b> always pay every minimum — a missed one hurts your SIMAH record for years. Extra goes to the #1 target.','The <b>months-to-debt-free timeline</b> only appears once you have a <b>validated monthly surplus</b> — the coach won’t invent one. Enter each card’s APR for an exact avalanche order.']},
 {g:'Monthly',t:'Read the 90-day Forecast',i:'📈',steps:['Open <b>Forecast</b> — a 90-day cash curve. The <b>solid</b> line is what’s <b>known</b>: dated obligations (bills, installments, card dues, payouts). It’s the confident line.','If it dips below zero, a red banner names the <b>date and why</b> — a known cash crunch to plan the cover for, not a prediction.','The <b>dashed</b> line adds your recent spending pattern — it’s <b>provisional</b> (off by default) until 3 months complete; toggle it with <b>[show]</b>.','Unpriced bills make even the solid line <b>understated</b> — the banner says how many. <a href="/recurring" style="color:var(--gold2)">Price them</a> for a truer curve.']},
 {g:'Monthly',t:'Track your subscriptions',i:'🔁',steps:['Open <b>Subscriptions</b> — your <b>declared</b> recurring bills plus anything <b>detected</b> recurring in the ledger, and the <b>monthly commitment</b> they add up to.','The total is <b>honest but incomplete</b> until every bill has an amount — the banner says how many are still unpriced (<a href="/recurring" style="color:var(--gold2)">set amounts</a>).','<b>Detected · not yet declared</b> proposes recurring charges you haven’t set up as bills — one tap to declare them. Transfers, fees and one-offs are filtered out.','<b>Price-creep &amp; unused</b> starts watching now and flags changes once enough months complete.']},
 {g:'Household',t:'See the family per person',i:'👪',steps:['Open <b>Family</b> — a card per person (from your <b>person tags</b>): what they spent this month, their <b>pocket</b> (spendable balances they hold — never their card debt), and a <b>monthly-spend trend</b>.','The trend firms up as months complete — the banner names when (it needs 3 complete months).','<b>Qattah & lending</b> shows what the family is owed; it fills from the <b>Owed to me</b> ledger.','Tap any person to open their full transactions on the Desk.']},
 {g:'Getting around',t:'Arrange your sidebar',i:'⠿',steps:['At the bottom of the nav tap <b>⠿ Arrange sidebar</b>.','<b>Drag any tab</b> by its grip to reorder; tap the <b>eye</b> to hide a tab you don’t use.','Tap <b>✓ Done</b> to save — your order shows on <b>every</b> page. <b>reset order</b> puts it back to default.','A hidden tab is only hidden from the rail — it’s still reachable by its URL and by <b>⌘K</b> search. Nothing is ever deleted.']},
];
const GROUPS=['Daily','Monthly','Fixing mistakes','Money concepts','Household','Getting around'];
let TAB='All';
function render(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  document.getElementById('tabs').innerHTML=['All','How HAKIM thinks',...GROUPS].map(t=>`<span class="tab ${TAB===t?'on':''}" onclick="TAB='${t.replace(/'/g,"")}';render()">${t}</span>`).join('');
  const body=document.getElementById('body');
  if(TAB==='How HAKIM thinks'){body.innerHTML=doctrines();return;}
  const groups=GROUPS.filter(g=>TAB==='All'||TAB===g);
  let h='';
  for(const g of groups){
    const items=R.filter(r=>r.g===g&&(!q||(r.t+' '+r.steps.join(' ')).toLowerCase().includes(q)));
    if(!items.length)continue;
    h+=`<div class="grp"><h2>${g}</h2><div class="cards">`+items.map(r=>`
      <div class="recipe"><h3>${r.i} ${esc(r.t)}</h3>
        <ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`).join('')+`</div></div>`;
  }
  body.innerHTML=h||`<div class="none">No recipe matches “${esc(q)}”.</div>`;
}
function doctrines(){
  const D=[
   ['One door for writes','Every change to your money happens on the <b>Desk</b> (or a deliberate management surface). No other screen edits data — so there’s one place to look, and one place to be careful.'],
   ['The truth engine is below, your face is above','Firefly III holds the ledger; HAKIM is the surface you live in. Every action happens <b>here</b> — you should never be sent to Firefly’s own screens.'],
   ['Flag, don’t guess','When something isn’t known — a card’s network, a bill’s amount, your nisab — HAKIM shows a flag and asks, rather than inventing a number. An honest blank beats a confident wrong.'],
   ['Honest empty states','Half-built things say so. Placeholder amounts are never printed as if real. A number you see is a number that’s true.'],
   ['Totals prove themselves','Splits sum to the whole; envelope = contributions − spending; a sum-check line shows the maths. You can always see why a number is what it is.'],
   ['Exclude, don’t delete','A wrong bank line is <b>excluded</b> (kept on the statement, dropped from analytics), not erased — because the statement is truth and reconciliation must survive.'],
   ['The surplus gate','Advice that needs to know your real surplus — “stop spending”, “safe to spend”, budget proposals — waits until there’s enough lived data to be right. Until then you get honest arithmetic (like the envelope recovery date), never a guess with authority.'],
  ];
  return `<div class="grp"><h2>How HAKIM thinks</h2>`+D.map(([t,p])=>`<div class="doct"><h3>${t}</h3><p>${p}</p></div>`).join('')+`</div>`;
}
render();
</script>
