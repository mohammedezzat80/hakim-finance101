<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAKIM · Insights</title>
<script src="/face.js"></script>
<link rel="stylesheet" href="/face.css">
<style>
:root{
 --bg:#0D0F16;--panel:#1B1F2C;--panel2:#232837;--line:#262B3A;--railbg:#0A0C12;
 --gold:#e8b95a;--gold2:#72D5C8;--teal:#72D5C8;--mint:#72D5C8;--red:#E05252;--amber:#e8b95a;
 --inc:#72D5C8;--exp:#D98A93;
 --txt:#FFFFFF;--lbl:#8A90A6;--muted:#5A6072;
 --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;--sans:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;
 --sp:24px;--rad:14px;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
a{color:inherit;text-decoration:none}
.rail{position:fixed;left:0;top:0;bottom:0;width:222px;z-index:40;background:var(--railbg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.brand{padding:2px 8px 16px;cursor:pointer}.brand .wm{font-family:var(--mono);font-size:15px;letter-spacing:2px;font-weight:800}
.brand .wm .sp{color:var(--gold)}.brand .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--lbl);font-weight:600;font-size:14.5px;cursor:pointer}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.85}.nav:hover{background:#1a1d23;color:var(--txt)}
.nav.active{background:rgba(114,213,200,.12);color:var(--gold2)}
.nav .qbadge{margin-left:auto;background:var(--mint);color:#0D0F16;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:800;font-family:var(--mono)}
.rsec{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#4b5260;margin:18px 10px 8px;display:flex}
.rsec .rt{margin-left:auto;color:var(--amber)}
.acc{display:flex;align-items:center;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.acc:hover{background:#1a1d23}.acc .an{flex:1;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.acc .av{font-family:var(--mono);font-weight:600}.acc.crd .av{color:var(--amber)}
.spacer{flex:1;min-height:12px}
.railstat{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.railstat .live{display:inline-flex;align-items:center;gap:7px;color:var(--teal)}
.railstat .live .d{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 7px var(--teal);animation:pul 2s infinite}
.railstat .live.off{color:var(--muted)}.railstat .live.off .d{background:var(--muted);box-shadow:none;animation:none}
.railstat .live.amber{color:var(--amber)}.railstat .live.amber .d{background:var(--amber)}
.railstat .bad{color:var(--red)}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
.app{max-width:960px;padding:22px 28px 64px;margin-left:max(222px,calc((100% - 960px)/2));margin-right:auto}
@media(max-width:900px){.rail{width:56px;padding:14px 6px}.brand .wm{font-size:0}.brand .wm::before{content:"✦";font-size:18px;color:var(--gold)}.brand .sub,.nav span:not(.qbadge),.rsec,.acc,.railstat{display:none}.nav{justify-content:center}.app{margin-left:56px}}
.topbar{display:flex;align-items:baseline;gap:14px;margin-bottom:var(--sp);flex-wrap:wrap}
.topbar h1{font-size:22px;font-weight:700;margin:0}.topbar .subtitle{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.card{background:linear-gradient(180deg,#1B1F2C,#151823);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;margin-bottom:var(--sp)}
.lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lbl);font-weight:700}
.sec{font-size:13px;font-weight:700}.secsub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;margin-bottom:12px}
.ins{display:flex;gap:13px;padding:14px 4px;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:none}
.ins .ii{width:34px;height:34px;border-radius:10px;background:rgba(114,213,200,.1);color:var(--mint);display:flex;align-items:center;justify-content:center;flex:none}
.ins .it{font-size:14.5px;font-weight:700}.ins .ib{font-size:13px;color:var(--lbl);margin-top:3px;line-height:1.5}
.ins .isample{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px}
.ins .igo{margin-left:auto;align-self:center;font-family:var(--mono);font-size:11px;color:var(--gold2);white-space:nowrap}
.pend{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);color:var(--muted)}
.pend:first-of-type{border-top:none}
.pend .pd{width:8px;height:8px;border-radius:50%;border:1.5px solid #3d4453;flex:none}
.pend .pt{font-size:13px;color:var(--lbl)}.pend .pn{font-family:var(--mono);font-size:11px;margin-left:auto;color:var(--amber)}
.jump{display:flex;gap:12px;flex-wrap:wrap}
.jbtn{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:12px 16px;cursor:pointer;font-size:13px}
.jbtn:hover{border-color:var(--gold2)}.jbtn svg.ic{color:var(--gold2)}
</style>
</head>
<body>
<aside class="rail" id="hakim-rail"></aside>
<div class="app">
  <div class="topbar"><div><h1>Insights</h1><div class="subtitle">patterns — only what the data actually supports, with its sample shown</div></div></div>
  <div id="body"><div class="secsub">Loading…</div></div>
</div>
<script>
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC=(n)=>window.ic?window.ic(n):'';
const ICO={concentration:'chart',weekday:'calendar',trend:'chart',anomaly:'alert',seasonal:'calendar'};

async function load(){
  let d;try{d=await(await fetch('/api/insights')).json();}catch(e){document.getElementById('body').innerHTML='<div class="card">Could not load Insights.</div>';return;}
  let h='';

  // early reads (qualify now)
  h+=`<div class="card"><div class="sec">Early reads</div><div class="secsub">observations the ${d.weeks} weeks of data already support — each shows its sample</div>`;
  if(!d.now.length){
    h+=`<div class="secsub" style="margin:0">Nothing qualifies yet — and that’s the honest answer, not an empty one. Patterns need more months than you’ve lived.</div>`;
  }else{
    h+=d.now.map(x=>`<div class="ins"><div class="ii">${IC(ICO[x.kind]||'bulb')}</div><div style="flex:1"><div class="it">${esc(x.title)}</div><div class="ib">${esc(x.body)}</div><div class="isample">based on ${esc(x.sample)}</div></div>${x.link?`<a class="igo" href="${x.link}">open →</a>`:''}</div>`).join('');
  }
  h+=`</div>`;

  // coming into focus (pending, with unlock dates)
  if(d.pending.length){
    h+=`<div class="card"><div class="sec">Coming into focus</div><div class="secsub">patterns that need more history — each names exactly when it unlocks</div>`;
    h+=d.pending.map(p=>`<div class="pend"><span class="pd"></span><span class="pt">${esc(p.title)}</span><span class="pn">needs ${esc(p.need)} · ${esc(p.ready)}</span></div>`).join('');
    h+=`<div class="secsub" style="margin:12px 0 0">No estimate is shown as a pattern before its sample supports it. On <b>30 September</b> the trend and anomaly finders come alive.</div></div>`;
  }

  // reuse, don't rebuild — jump to the surfaces that already compute the deeper views
  h+=`<div class="card"><div class="sec">Go deeper</div><div class="secsub">these already exist — Insights links to them rather than duplicating them</div>
    <div class="jump">
      <div class="jbtn" onclick="location.href='${d.links.sankey}'">${IC('chart')} <div><div style="font-weight:700">Money-flow Sankey</div><div class="isample" style="margin:0">income → categories → saved · in Reports</div></div></div>
      <div class="jbtn" onclick="location.href='${d.links.subs}'">${IC('refresh')||IC('cart')} <div><div style="font-weight:700">Recurring detection</div><div class="isample" style="margin:0">what repeats · in Subscriptions</div></div></div>
    </div></div>`;

  document.getElementById('body').innerHTML=h;
}
load();
</script>
<script src="/rail.js"></script>
</body>
</html>
