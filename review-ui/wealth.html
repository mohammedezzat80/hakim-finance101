<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAKIM · Wealth</title>
<script src="/face.js"></script>
<link rel="stylesheet" href="/face.css">
<style>
:root{
 --bg:#0D0F16;--panel:#1B1F2C;--panel2:#232837;--line:#262B3A;--railbg:#0A0C12;
 --gold:#e8b95a;--gold2:#72D5C8;--teal:#72D5C8;--mint:#72D5C8;--red:#E05252;--amber:#e8b95a;
 --inc:#72D5C8;--exp:#D98A93;
 --txt:#FFFFFF;--lbl:#8A90A6;--muted:#5A6072;
 --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;--sans:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;
 --sp:24px;--rad:14px;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px}
a{color:inherit;text-decoration:none}
.rail{position:fixed;left:0;top:0;bottom:0;width:222px;z-index:40;background:var(--railbg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.brand{padding:2px 8px 16px;cursor:pointer}.brand .wm{font-family:var(--mono);font-size:15px;letter-spacing:2px;font-weight:800}
.brand .wm .sp{color:var(--gold)}.brand .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--lbl);font-weight:600;font-size:14.5px;cursor:pointer}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.85}.nav:hover{background:#1a1d23;color:var(--txt)}
.nav.active{background:rgba(114,213,200,.12);color:var(--gold2)}
.nav .qbadge{margin-left:auto;background:var(--mint);color:#0D0F16;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:800;font-family:var(--mono)}
.rsec{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#4b5260;margin:18px 10px 8px;display:flex}
.rsec .rt{margin-left:auto;color:var(--amber)}
.acc{display:flex;align-items:center;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.acc:hover{background:#1a1d23}.acc .an{flex:1;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.acc .av{font-family:var(--mono);font-weight:600}.acc.crd .av{color:var(--amber)}
.spacer{flex:1;min-height:12px}
.railstat{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.railstat .live{display:inline-flex;align-items:center;gap:7px;color:var(--teal)}
.railstat .live .d{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 7px var(--teal);animation:pul 2s infinite}
.railstat .live.off{color:var(--muted)}.railstat .live.off .d{background:var(--muted);box-shadow:none;animation:none}
.railstat .live.amber{color:var(--amber)}.railstat .live.amber .d{background:var(--amber)}
.railstat .bad{color:var(--red)}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
.app{max-width:1000px;padding:22px 28px 64px;margin-left:max(222px,calc((100% - 1000px)/2));margin-right:auto}
@media(max-width:900px){.rail{width:56px;padding:14px 6px}.brand .wm{font-size:0}.brand .wm::before{content:"✦";font-size:18px;color:var(--gold)}.brand .sub,.nav span:not(.qbadge),.rsec,.acc,.railstat{display:none}.nav{justify-content:center}.app{margin-left:56px}}
.topbar{display:flex;align-items:baseline;gap:14px;margin-bottom:var(--sp);flex-wrap:wrap}
.topbar h1{font-size:22px;font-weight:700;margin:0}.topbar .subtitle{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.card{background:linear-gradient(180deg,#1B1F2C,#151823);border:1px solid var(--line);border-radius:var(--rad);padding:20px 22px;margin-bottom:var(--sp)}
.lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lbl);font-weight:700}
.sec{font-size:13px;font-weight:700}.secsub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;margin-bottom:12px}
.cur{font-size:.4em;color:var(--muted);font-weight:400;margin-right:.12em}.dec{font-size:.5em;color:var(--muted);opacity:.7}
.big{font-family:var(--face-display);font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1}
.big.neg{color:var(--exp)}
.stat{display:flex;gap:34px;flex-wrap:wrap;align-items:baseline;margin-top:14px}
.stat .n{font-family:var(--mono);font-size:18px;font-weight:800}.stat .s{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp)}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.arow{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:13px}
.arow .an{width:130px;color:var(--lbl);flex:none}
.abar{flex:1;height:9px;border-radius:5px;background:var(--panel2);overflow:hidden}.abar i{display:block;height:100%}
.arow .av{font-family:var(--mono);font-weight:800;width:96px;text-align:right}
.arow .ap{font-family:var(--mono);font-size:11px;color:var(--muted);width:42px;text-align:right}
.emptyface{padding:20px 0}
</style>
</head>
<body>
<aside class="rail" id="hakim-rail"></aside>
<div class="app">
  <div class="topbar"><div><h1>Wealth</h1><div class="subtitle">your whole position · allocation · currency · what’s locked</div></div></div>
  <div id="body"><div class="secsub">Loading…</div></div>
</div>
<script>
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money0=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
function m(n){n=Number(n||0);const neg=n<0;n=Math.abs(n);const i=Math.floor(n).toLocaleString('en-US');const d=(n-Math.floor(n)).toFixed(2).slice(1);return `<span class="cur">SAR</span>${neg?'−':''}${i}<span class="dec">${d}</span>`;}
const IC=(n)=>window.ic?window.ic(n):'';
const PAL=['#72D5C8','#e8b95a','#a78bfa','#5b8def','#e879a6','#d0946b','#7dd3fc','#9aa4bf'];

function nwchart(series){let s=series||[];if(s.length<2)return '<div class="secsub" style="margin:0">Net-worth history builds as weeks pass.</div>';
  const W=880,H=180,L=52,R=14,T=12,B=24;const vals=s.map(p=>p.value);let mn=Math.min(...vals),mx=Math.max(...vals);const pd=(mx-mn)*0.15||1000;mn-=pd;mx+=pd;
  const x=i=>L+i*(W-L-R)/(s.length-1),y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let grid='';for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3,yy=y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#232830"/><text x="${L-8}" y="${(yy+3).toFixed(1)}" text-anchor="end" style="fill:#5A6072;font:11px var(--mono)">${(v/1000).toFixed(0)}K</text>`;}
  const zy=y(0);const zero=(mn<0&&mx>0)?`<line x1="${L}" x2="${W-R}" y1="${zy.toFixed(1)}" y2="${zy.toFixed(1)}" stroke="#E05252" stroke-dasharray="2 3" opacity=".5"/>`:'';
  const pts=s.map((p,i)=>x(i).toFixed(1)+','+y(p.value).toFixed(1)).join(' ');
  // hover band per week → shared face tooltip (one-owner)
  const step=(W-L-R)/(s.length-1);const M=v=>window.hkMoney?window.hkMoney(v):('SAR '+money0(v));
  const dl=p=>p&&p.date?new Date(p.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
  const hov=s.map((p,i)=>`<rect x="${(x(i)-step/2).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${(H-T-B).toFixed(1)}" fill="transparent" data-tip="${dl(p)?dl(p)+' · ':''}net worth ${M(p.value)}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${grid}${zero}<polyline points="${pts}" fill="none" stroke="#72D5C8" stroke-width="2"/>${hov}</svg>`;
}

async function load(){
  let d,dash;try{[d,dash]=await Promise.all([fetch('/api/wealth').then(r=>r.json()),fetch('/api/dash').then(r=>r.json()).catch(()=>({}))]);}catch(e){document.getElementById('body').innerHTML='<div class="card">Could not load Wealth.</div>';return;}
  let h='';

  if(!d.has_positions){
    h+=`<div class="matbanner">${IC('info')} <b>This is your cash-and-bank position only.</b> Your investments aren’t entered yet — add certificates, HISSAR balances, gold and funds (<a href="/accounts" style="color:var(--gold2)">Accounts → + New ▾ → Investment</a>), and allocation, currency exposure and performance fill in.</div>`;
  }

  // headline
  h+=`<div class="card"><div class="lbl">Net worth · whole position</div>
    <div class="big ${d.net_worth<0?'neg':''}" style="margin-top:8px">${m(d.net_worth)}</div>
    <div class="stat">
      <div><div class="n inc">${m(d.assets)}</div><div class="s">total assets</div></div>
      <div><div class="n">${d.invested>0?m(d.invested):'—'}</div><div class="s">invested (non-cash)</div></div>
      <div><div class="n">${d.restricted>0?m(d.restricted):'—'}</div><div class="s">restricted / locked</div></div>
    </div></div>`;

  // trajectory
  h+=`<div class="card"><div class="sec">Net-worth trajectory</div><div class="secsub">assets − debts, week by week</div>${nwchart(dash.nw_series)}</div>`;

  h+=`<div class="two">`;

  // allocation
  const at=(d.allocation||[]).reduce((a,x)=>a+x.amount,0)||1;
  h+=`<div class="card"><div class="sec">Allocation</div><div class="secsub">where your assets sit</div>`;
  h+=(d.allocation||[]).map((x,i)=>`<div class="arow"><span class="an">${esc(x.cls)}</span><span class="abar"><i style="width:${x.amount/at*100}%;background:${PAL[i%PAL.length]}"></i></span><span class="av">${money0(x.amount)}</span><span class="ap">${Math.round(x.amount/at*100)}%</span></div>`).join('');
  if(!d.has_positions){h+=`<div class="secsub" style="margin:10px 0 0">Only cash classes so far — Gold, Certificates, HISSAR and Funds appear once entered.</div>`;}
  h+=`</div>`;

  // currency exposure
  const ct=(d.currency_exposure||[]).reduce((a,x)=>a+x.amount,0)||1;
  h+=`<div class="card"><div class="sec">Currency exposure</div><div class="secsub">what your wealth is held in</div>`;
  h+=(d.currency_exposure||[]).map((x,i)=>`<div class="arow"><span class="an">${esc(x.cur)}</span><span class="abar"><i style="width:${x.amount/ct*100}%;background:${PAL[i%PAL.length]}"></i></span><span class="av">${money0(x.amount)}</span><span class="ap">${Math.round(x.amount/ct*100)}%</span></div>`).join('');
  h+=`</div></div>`;

  // performance analytics — honest-empty (needs entered purchase prices)
  h+=`<div class="card"><div class="sec">Performance</div><div class="secsub">time-weighted &amp; annualized return · allocation drift · contribution to growth</div>
    <div class="emptyface secsub" style="margin:0">${IC('clock')} Performance is computed <b>only from your own entered prices and purchase records</b> — no market data, no benchmarks (that stays HISSAR/BAHHATH territory). It opens once your positions carry a cost basis and a current value. Nothing to compute yet — honestly, not emptily.</div></div>`;

  document.getElementById('body').innerHTML=h;
}
load();
</script>
<script src="/rail.js"></script>
</body>
</html>
